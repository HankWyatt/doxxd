              $ref: "#/components/schemas/PoolLiquidityStatus"
    DataResponse_PoolStats:
      type: object
      description: Response envelope wrapping a single value.
      required:
        - data
      properties:
        data:
          type: object
          required:
            - pool_address
            - mint
            - quote_mint
            - exchange
            - pool_type
            - volume_5m
            - trades_5m
            - buys_5m
            - sells_5m
            - makers_5m
            - volume_1h
            - trades_1h
            - buys_1h
            - sells_1h
            - makers_1h
            - volume_6h
            - trades_6h
            - buys_6h
            - sells_6h
            - makers_6h
            - volume_24h
            - trades_24h
            - buys_24h
            - sells_24h
            - makers_24h
          properties:
            base_decimals:
              type:
                - integer
                - "null"
              format: int32
              description: Base token decimals, when recorded.
            base_reserve:
              type:
                - string
                - "null"
              format: decimal
              description: |-
                Whole base tokens the pool held once the transaction at
                `reserves_slot` settled: its vault's balance (a bonding curve's
                includes supply it has not sold).
            buys_1h:
              type: integer
              format: int64
            buys_24h:
              type: integer
              format: int64
            buys_5m:
              type: integer
              format: int64
            buys_6h:
              type: integer
              format: int64
            exchange:
              type: string
            first_trade_at:
              type:
                - string
                - "null"
              format: date-time
            last_trade_price:
              type:
                - string
                - "null"
              format: decimal
              description: |-
                Price of the pool's last trade, in whole `quote_mint` tokens per whole
                base token, at `latest_trade_at`. Absent until the pool has traded.
            last_trade_price_sol:
              type:
                - string
                - "null"
              format: decimal
              description: |-
                `last_trade_price` when `quote_mint` is wrapped SOL, in SOL per whole
                base token; absent for a pool quoted in anything else.
            latest_trade_at:
              type:
                - string
                - "null"
              format: date-time
            liquidity_quote:
              type:
                - string
                - "null"
              format: decimal
              description: |-
                The pool's liquidity in whole `quote_mint` tokens: `quote_reserve` plus
                `base_reserve` at `last_trade_price`, the base side counted for no
                more than `quote_reserve`, the side a holder can exit into. A balanced
                pool reads both sides whole; a single-sided or mispriced one reads at
                most twice its quote. A bonding curve reads `quote_reserve` alone,
                since no seller can take out its unsold supply. Absent until the
                pool's reserves are known.
            liquidity_sol:
              type:
                - string
                - "null"
              format: decimal
              description: |-
                `liquidity_quote` in SOL, at the quote asset's SOL price. Absent when
                the quote has none.
            liquidity_usd:
              type:
                - number
                - "null"
              format: double
              description: |-
                `liquidity_sol` in US dollars, at a qualified current SOL/USD source.
                Absent when either conversion is unavailable or stale.
            makers_1h:
              type: integer
              format: int64
            makers_24h:
              type: integer
              format: int64
            makers_5m:
              type: integer
              format: int64
            makers_6h:
              type: integer
              format: int64
            mint:
              type: string
              description: Base token mint (base-58).
            pool_address:
              type: string
            pool_type:
              $ref: "#/components/schemas/PoolType"
              description: Pool kind.
            price_change_1h:
              type:
                - string
                - "null"
              format: decimal
              description: |-
                Percent change of `last_trade_price` over the window, measured in the
                pool's own quote asset; absent when either end is unpriced.
            price_change_24h:
              type:
                - string
                - "null"
              format: decimal
            price_change_6h:
              type:
                - string
                - "null"
              format: decimal
            quote_decimals:
              type:
                - integer
                - "null"
              format: int32
              description: Quote token decimals, when recorded.
            quote_mint:
              type: string
              description: |-
                Quote token mint (base-58): the asset every price and volume in this row
                is denominated in. Any token, not only wrapped SOL
                (`So11111111111111111111111111111111111111112`); a USDC pool's prices
                are in USDC.
            quote_reserve:
              type:
                - string
                - "null"
              format: decimal
              description: |-
                Whole `quote_mint` tokens the pool held then. A pump.fun curve's is the
                SOL it holds past its rent.
            reserves_at:
              type:
                - string
                - "null"
              format: date-time
              description: Block time of `reserves_slot`.
            reserves_slot:
              type:
                - integer
                - "null"
              format: int64
              description: |-
                Slot of the newest swap or creation the reserves were read off. They
                move with swaps only, so a deposit or withdrawal shows at the next
                swap.
            sells_1h:
              type: integer
              format: int64
            sells_24h:
              type: integer
              format: int64
            sells_5m:
              type: integer
              format: int64
            sells_6h:
              type: integer
              format: int64
            trades_1h:
              type: integer
              format: int64
            trades_24h:
              type: integer
              format: int64
            trades_5m:
              type: integer
              format: int64
            trades_6h:
              type: integer
              format: int64
            volume_1h:
              type: string
              format: decimal
              description: Quote volume over the last hour, in whole `quote_mint` tokens.
            volume_24h:
              type: string
              format: decimal
              description: Quote volume over the last 24 hours, in whole `quote_mint` tokens.
            volume_5m:
              type: string
              format: decimal
              description: Quote volume over the last 5 minutes, in whole `quote_mint` tokens.
            volume_6h:
              type: string
              format: decimal
              description: Quote volume over the last 6 hours, in whole `quote_mint` tokens.
    DataResponse_SolPrice:
      type: object
      description: Response envelope wrapping a single value.
      required:
