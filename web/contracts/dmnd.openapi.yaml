        program_id:
          type: string
        protocol:
          type: string
          description: Qualified mechanism ID; it does not authenticate the originating frontend.
        signature:
          type: string
        slot:
          type: integer
          format: int64
        source:
          $ref: "#/components/schemas/LiquidityActionSource"
        transaction_index:
          type: integer
          format: int32
    LiquidityActionKind:
