  /tokens/{mint}/ohlcv:
    get:
      tags:
        - OHLCV
      summary: Get a token reference-pool OHLCV series
      description: One selected pool price candle per completed bucket, oldest first, across pool migrations. Source pool, quote mint and historical conversion provenance accompany each bar. Historical rate pools require at least 50 SOL of quote volume in the 61-minute window ending at the bucket's final minute; the busiest eligible pool supplies its latest positive one-minute close when present, otherwise its latest stored aggregate close. Converted SOL/USD OHLC uses that one historical rate sampled by the bucket's end; converted highs and lows are projections of quote-price extrema, not intra-bucket converted extrema. The original volume and trade-count fields refer only to the selected price pool. Separate all_pool_* fields sum eligible observed pool candles in the bucket; unknown SOL/USD quote conversions contribute token volume and trades but are excluded from known converted totals and counted in the matching unpriced-pool field. The unpriced trade counts and base-token volumes quantify activity omitted from known converted totals; the unknown SOL/USD amounts cannot be inferred from them. Unpriced-pool counts are per bucket, so summing buckets counts pool-candle occurrences, not unique pools. Conversion status distinguishes an unavailable quote rate from an unavailable SOL/USD rate. Missing buckets are omitted; missing price conversions remain null. Response coverage counts whole completed buckets and missing eligible candles, and explicitly marks historical completeness as unverified, even for a full returned series. Missing buckets never certify zero on-chain trades. Only stored DMND candles are read; historical ingest gaps may exist. Supports 1m, 5m, 15m, 1h, 4h and 1d, up to 500 buckets per request. The range is [from,to).
      operationId: getTokenOhlcv
      parameters:
        - name: mint
          in: path
          description: Token mint (base-58).
          required: true
          schema:
            type: string
        - name: resolution
          in: query
          description: Stored candle resolution.
          required: true
          schema:
            $ref: "#/components/schemas/TokenChartResolution"
        - name: from
          in: query
          description: Range start (inclusive), RFC-3339.
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Range end (exclusive), RFC-3339; no later than now.
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Reference-pool candles and explicit historical coverage uncertainty
          content:
            application/json:
              schema:
