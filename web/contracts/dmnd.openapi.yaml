  /wallets/{wallet}/positions:
    get:
      tags:
        - Wallets
      summary: List a wallet's positions
      description: |-
        Every token attributed to the wallet by indexed trades (from `positions_since` on), with what it bought and sold, its PnL by average cost, and its balance now in all indexed positive accounts owned by the exact wallet/mint, including non-associated accounts. Current SOL marks require a selected-pool token trade at most one hour old. Required quote conversion and SOL/USD observations must be no more than 120 seconds old. Unknown or stale marks leave current values/PnL null while preserving original trading totals and realized PnL. Ordered by `sort`: `total_pnl` (the default), `unrealized_pnl`, `value` (all in SOL, unknown values last) or `last_active` (the position's last trade).

        Tokens the wallet holds but never traded (airdrops, transfers) are not listed; use holdings/overview for inventory and scan coverage. Indexed balances do not imply a complete wallet snapshot. More than 10,000 positions or 20,000 positive token accounts answers 422 `too_large` (kept for 60 s). The required owner index being absent or invalid answers 503 `wallet_holdings_unavailable`.

        Raw account/trade evidence is cached for 5 s; current conversions are revalidated separately. A multi-page read freezes values and order across API replicas until the earlier of 5 minutes and its oldest actual conversion deadline. page_snapshot_at is the original capture, not a chain or price observation. Continuations preserve captured values, including unknowns; newer same-price observations do not move that capture or extend its deadline. The cursor binds wallet and sort; limit may change. Expired, evicted or data-corrected results answer 400 and require restarting without a cursor. Cache pressure/unavailability answers 503. Single-page reads need no saved result and omit page_snapshot fields. Every request costs 15 rate-limit tokens whatever its limit.
      operationId: getWalletPositions
      parameters:
        - name: wallet
          in: path
          description: Wallet address (base-58).
          required: true
          schema:
            type: string
        - name: sort
          in: query
          description: Order (default `total_pnl`).
          required: false
          schema:
