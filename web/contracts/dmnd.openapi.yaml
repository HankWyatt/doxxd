  /pools/{address}/curve-observations:
    get:
      tags:
        - Pools
      summary: Read latest recorded pool curve event
      description: Reads one latest admitted Send exact-in event from DMND's database. Virtual/real reserve and fee atom strings are recorded event evidence, not fresh account state, executable depth, an execution quote, USD value or complete history. The program/model and transaction-wide canonical ordinals bind the retained framed event bytes and SHA256. Event/block/capture/read clocks remain separate. Older replay cannot replace newer state; conflict detection covers the current latest record and duplicate incoming coordinates, not overwritten history. Supported means an admitted observed model for the indexed market, not current-epoch or all-layout coverage. Unsupported indexed pools return supported=false; missing observations remain null and prove nothing about absent state. No request-time RPC, queue or cache. Current-state verification, execution-quote availability and historical completeness remain false.
      operationId: getPoolCurveObservations
      parameters:
        - name: address
          in: path
          description: Indexed pool address, base-58.
          required: true
          schema:
