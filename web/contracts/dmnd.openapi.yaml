  /wallets/{wallet}/transfers:
    get:
      tags:
        - Wallets
      summary: List a wallet's observed explicit transfers
      description: Pages successful System, SPL Token and Token-2022 transfer instructions attributed to this wallet by transaction metadata. Optional RFC3339 from (inclusive) and to (exclusive) filter block_time in each bounded slot-ordered scan page; repeat them on cursor requests. A filtered page can be empty while has_more is true, so follow the cursor until exhausted. Amounts are raw instructed atoms, not net received amounts. A self transfer appears once. Attribution has its own start slot, which can be newer than transaction-transfer indexing after an ingest upgrade. Token transfers without a proven owner or mint lower attribution coverage and may be absent from this wallet feed. Native SOL completeness requires the full stream. Earlier history, swaps, staking, DeFi actions, mint/burn and extension-specific movements are outside this feed. A newer failed or zero-transfer observation suppresses older-fork rows. When configured, verified archived transfers and captured corrections are merged with uncataloged database rows. Archived pages may be short or empty while has_more is true; follow the opaque cursor to continue the scan. A missing or corrupt cataloged object makes the request unavailable. Reads indexed DMND data only; no request-time upstream RPC.
      operationId: getWalletTransfers
      parameters:
        - name: wallet
          in: path
          description: Wallet address (base-58).
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Raw rows examined per page (default 50); a time-filtered page may return fewer matches.
          required: false
          schema:
            type: integer
            format: int32
            maximum: 100
            minimum: 1
        - name: cursor
          in: query
          description: Opaque continuation cursor.
          required: false
          schema:
            type: string
        - name: from
          in: query
          description: RFC3339 block time, inclusive; filtered pages may be empty.
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: RFC3339 block time, exclusive; filtered pages may be empty.
          required: false
