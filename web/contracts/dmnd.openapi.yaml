        dev_pct:
          type:
            - string
            - "null"
          format: decimal
        holder_change_1h:
          type:
            - integer
            - "null"
          format: int64
        holder_change_24h:
          type:
            - integer
            - "null"
          format: int64
        holder_change_at:
          type:
            - string
            - "null"
          format: date-time
        holder_count:
          type:
            - integer
            - "null"
          format: int64
          description: Positive holders counted on count_basis; a lower bound if incomplete.
        holder_count_excluding_lp:
          type:
            - integer
            - "null"
          format: int64
          description: The same basis, excluding pool vaults, shared authorities and burns.
        holders_complete:
          type: boolean
        insiders_pct:
          type:
            - string
            - "null"
          format: decimal
        mint:
          type: string
        observed_at:
          type: string
          format: date-time
          description: API publish time, not the time of each balance change.
        owner_count:
          type:
            - integer
            - "null"
          format: int64
          description: Stored owner observation, independent of the selected count basis.
        owner_count_excluding_lp:
          type:
            - integer
            - "null"
          format: int64
        owner_count_source_generation:
          type:
            - string
            - "null"
        owner_count_source_revision:
          type:
            - string
            - "null"
        owners_current:
          type:
            - boolean
            - "null"
          description: |-
            Matching captured/current source context, active tracking and no pending change.
            Null means legacy or untracked provenance, never certified current.
        publication_generation:
          type:
            - string
            - "null"
          description: Committed coherent projection identity. Opaque, scoped to this mint.
        publication_revision:
          type:
            - string
            - "null"
          description: |-
            Canonical decimal string; compare numerically only within the same
            mint/publication generation. Equal means the identical stored facts.
        snipers_pct:
          type:
            - string
            - "null"
          format: decimal
        source_at:
          type:
            - string
            - "null"
          format: date-time
          description: Source transaction observation time; not a commit/publication clock.
        source_generation:
          type:
            - string
            - "null"
          description: UUID generations are opaque equality contexts scoped to this mint.
        source_pending:
          type: boolean
        source_revision:
          type:
            - string
            - "null"
          description: Canonical decimal string, ordered only within this mint/generation.
        source_slot:
          type:
            - integer
            - "null"
          format: int64
        source_tracked:
          type: boolean
          description: Current bounded rank or unexpired stream tracking covers this mint.
        top100_pct:
          type:
            - string
            - "null"
          format: decimal
        top10_pct:
          type:
            - string
            - "null"
          format: decimal
        top50_pct:
          type:
            - string
            - "null"
          format: decimal
        updated_at:
          type:
            - string
            - "null"
          format: date-time
          description: The last stored count/status update, including timeout or skip.
        watch_status:
          type:
            - string
            - "null"
          description: Registry capacity/lease status; fair snapshot recovery remains active.
    TokenHolders:
      type: object
      description: |-
        A page of a token's holders, largest balance first, with the counts and
        watermarks that say how far to trust it.
      required:
        - data
        - has_more
        - mint
        - count_status
        - holders_complete
        - sniper_slots
        - positions_tracked
        - sort
      properties:
        account_count:
          type:
            - integer
            - "null"
          format: int64
          description: |-
            Token accounts with a positive balance, kept exact by every balance
            write (an owner with two accounts counts twice). Null until DMND has
            counted the mint once since tracking it (immediately for a mint
            initialized since); a lower bound while `holders_complete` is false.
        account_count_as_of_slot:
          type:
            - integer
            - "null"
          format: int64
          description: The newest slot `account_count` reflects.
        as_of_slot:
          type:
            - integer
            - "null"
          format: int64
          description: The newest slot whose balances live ingest has committed.
        bootstrap:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/HolderBootstrapStatus"
              description: |-
                The backfill of an older mint's holders. A read of an incomplete
                mint queues one (no more than one per mint); null when none is needed
                (the mint is complete from its creation) or DMND has never seen the
                mint trade.
        bundlers_pct:
          type:
            - string
            - "null"
          format: decimal
        complete_since_slot:
          type:
            - integer
            - "null"
          format: int64
          description: The slot from which every change of this mint is held, when complete.
        concentration_at:
          type:
            - string
            - "null"
          format: date-time
          description: |-
            Recount snapshot read time. The mint supply itself can be an older
            metadata observation; this time does not certify its freshness.
        concentration_basis:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/HolderPercentageBasis"
              description: |-
                Denominator basis used by the independently stored concentration
                snapshot. Absence means older percentages have no qualified basis.
        concentration_complete:
          type:
            - boolean
            - "null"
          description: |-
            Whether that recount covers the current complete account inventory.
            Independent of this page's current account/count coverage.
        concentration_slot:
          type:
            - integer
            - "null"
          format: int64
          description: |-
            Committed index watermark checked before reading the recount; this is
            not a mint-account RPC context slot.
        concentration_supply:
          type:
            - string
            - "null"
          format: decimal
          description: Observed mint issued supply used by every concentration percentage.
        consistent_through_slot:
          type:
            - integer
            - "null"
          format: int64
          description: |-
            Every slot at or below this one has all its balances committed. Below
            `as_of_slot` while a gap fill runs.
        count_basis:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/CountBasis"
              description: |-
                What `holder_count` counts: `owners` or `accounts`. Null with
                `holder_count`. The basis can change between two reads with no
                holder change at all (an owner count goes stale, or a fresh one
                lands), and the number moves with it, usually by the few owners that
                hold more than one account: compare readings only on the same
                `count_basis`.
        count_status:
          $ref: "#/components/schemas/HolderCountStatus"
        counted_slot:
          type:
            - integer
            - "null"
          format: int64
          description: The frontier when the counts were last taken.
        cursor:
          type:
            - string
            - "null"
          description: |-
            Cursor to pass into the next request's `cursor` query parameter. `null`
            on the last page.
        data:
          type: array
          items:
            $ref: "#/components/schemas/TokenHolder"
          description: The current page's holders.
        decimals:
          type:
            - integer
            - "null"
          format: int32
        dev:
          type:
            - string
            - "null"
          description: The token's deployer (base-58), which the `dev` label marks.
        dev_pct:
          type:
            - string
            - "null"
          format: decimal
        dev_source:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/DevSource"
        has_more:
          type: boolean
          description: "`true` if at least one more page exists beyond the current one."
        holder_count:
          type:
            - integer
            - "null"
          format: int64
          description: |-
            Holders with a positive balance, counted as `count_basis` says:
            distinct owners while the recount matches the tracked source
            generation/revision with no pending change, else seeded token
            accounts as of `account_count_as_of_slot`. A lower bound while
            `holders_complete` is false; null when neither is known yet (a count
            `pending` and the account count not yet seeded) and when the count is
            `timed_out` or `skipped` with no account count. A poller can see it
            move when `count_basis` flips, with no holder change behind it.
        holder_count_excluding_lp:
          type:
            - integer
            - "null"
          format: int64
          description: |-
            `holder_count` less pool vaults, shared vault authorities and burn
            addresses, on the same basis.
        holders_complete:
          type: boolean
          description: |-
            Whether DMND holds every account of the mint and has counted them:
            true for a mint created after balances were switched on, once every
            slot since its creation is committed and its count finished, and for
            an older mint once its bootstrap is `done`. Until then the counts and
            the list leave out accounts that have not changed since, so they are
            lower bounds.
        insiders_pct:
          type:
            - string
            - "null"
          format: decimal
        label:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/HolderLabel"
              description: The label `data` was filtered to, when one was asked for.
        labels_basis:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/LabelsBasis"
              description: |-
                What `launch_slot` was read off. Null when DMND did not see the
                launch, and `pool` when only a pool's creation dates it: no `sniper`
                label is given then, rather than a guess.
        last_trade_price_sol:
          type:
            - string
            - "null"
          format: decimal
          description: Price used for `value_sol`, in SOL per whole token.
        launch_labelled_at:
          type:
            - string
            - "null"
          format: date-time
          description: |-
            When DMND labelled the launch window's bundlers and launch-transaction
            insiders (about a minute after `launch_slot`). Null until then, and
            for a mint whose launch DMND did not see.
        launch_slot:
          type:
            - integer
            - "null"
          format: int64
          description: The slot the token launched in, as far as DMND saw it.
        mint:
          type: string
        positions_since:
          type:
            - string
            - "null"
          format: date-time
          description: |-
            Positions count trades from this time on; null while tracked means
            every trade DMND holds.
        positions_tracked:
          type: boolean
          description: Whether DMND keeps positions (`bought`, `sold`, PnL) at all.
        sniper_slots:
          type: integer
          format: int64
          description: |-
            The `sniper` window: a first buy at most this many slots after
            `launch_slot`.
        snipers_pct:
          type:
            - string
            - "null"
          format: decimal
        sort:
          $ref: "#/components/schemas/HolderSort"
          description: |-
            The order of `data`: `balance` (the default), `realized_pnl`,
            `total_pnl`, `bought` or `first_buy`.
        supply:
          type:
            - string
            - "null"
          format: decimal
          description: Raw atoms. The denominator of `percent_of_supply`.
        supply_basis:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/HolderPercentageBasis"
              description: |-
                Present on replies using the observed mint issued-supply denominator.
                Older replies without a basis can use a stale indexed account sum.
        supply_source:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/SupplySource"
        top100_pct:
          type:
            - string
            - "null"
          format: decimal
        top10_pct:
          type:
            - string
            - "null"
          format: decimal
          description: |-
            Shares of observed issued mint supply, in percent, from the independent
            `concentration_at` / `concentration_slot` snapshot: the ten, 50 and 100 largest accounts
            outside pool vaults and burn addresses, the deployer's accounts, and
            the accounts of owners labelled sniper, bundler and insider. Null
            until a new count records a positive, noncontradictory mint denominator.
        top50_pct:
          type:
            - string
            - "null"
          format: decimal
