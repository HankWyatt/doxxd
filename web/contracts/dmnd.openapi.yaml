                - string
                - "null"
              format: date-time
              description: Graduation event observed by DMND; null means no event was indexed.
            launch:
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/TokenLaunchEvidence"
            mint:
              type: string
            other_pool_count:
              type: integer
              format: int64
    DataResponse_TokenMetadataSnapshot:
      type: object
      description: Response envelope wrapping a single value.
      required:
        - data
      properties:
        data:
          allOf:
            - $ref: "#/components/schemas/TokenOriginFields"
            - type: object
              required:
                - mint
                - observed_at
              properties:
