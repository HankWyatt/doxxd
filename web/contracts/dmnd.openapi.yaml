          format: date-time
          description: Graduation event observed by DMND; null means no event was indexed.
        launch:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/TokenLaunchEvidence"
        mint:
          type: string
        other_pool_count:
          type: integer
          format: int64
    TokenLifecycleCoverage:
      type: object
      required:
        - program
        - generation
        - historical_complete
        - current_curve_state_available
      properties:
        capture_since_slot:
          type:
            - integer
            - "null"
