      summary: List trades for a wallet
      description: |-
        Trades the wallet made, across every token and pool, newest first. Pass `mint` for one token's trades only. Trades in one block are ordered by slot, transaction and instruction, so the order is deterministic and a cursor walk is stable. A trade backfilled later with an older block time is not revisited by a cursor already past it.

        Answers 503 `wallet_trades_unavailable` while the index this route reads is being built.

        Optional from/to selects indexed source block times in [from,to); repeat both bounds with every cursor. Pages are not frozen: restart after repair/backfill. Coverage never certifies complete chain history, fees or historical FX. New endpoint: it may be limited to some plans later.
      operationId: getWalletTrades
      parameters:
        - name: wallet
          in: path
          description: Wallet address (base-58).
          required: true
          schema:
            type: string
        - name: mint
          in: query
          description: Only this token's trades (base-58 mint).
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Page size (default 50).
          required: false
