  /tokens:
    get:
      tags:
        - Tokens
      summary: List tokens
      description: Tokens ranked by the chosen sort criterion. Prices, market caps and volumes are in SOL whatever a token's pools are quoted in, so tokens quoted in SOL, USDC or another token rank together; a token whose quote assets have no SOL price has no price or market cap and ranks last by them. Filters run before pagination. Volume, market cap and liquidity are observed or derived SOL values, not live executable quotes; tokens with unknown market cap do not match a market-cap filter. Holder percentage ceilings use DMND's latest saved count and require complete holder coverage and a known share; missing launch evidence or supply does not pass as zero. The optional count-age limit uses the last successful full holder recount time and excludes unknown or future times; an old count alone does not prove balances changed. A holder-filtered or liquidity-filtered request screens at most 500 ranked market-filtered candidates plus one holder-enriched continuation sentinel. Liquidity uses eligible pools with known, nonstale reserves and SOL conversion; unknown liquidity does not match, even when the minimum is zero. It can return an empty page with `has_more=true`; follow its cursor to continue screening. These percentages are observations, not a security verdict.
      operationId: listTokens
      parameters:
        - name: sort_by
          in: query
          description: Sort field (default `volume_24h`).
          required: false
          schema:
            $ref: "#/components/schemas/TokenSortBy"
        - name: order
