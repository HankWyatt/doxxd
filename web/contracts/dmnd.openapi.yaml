  /tokens/lifecycle/events:
    get:
      tags:
        - Tokens
      summary: Page observed launch, completion and migration events
      description: "Reads independently indexed Pump lifecycle milestones from DMND's database. Created, completed and migrated are distinct successful program events; creation does not establish that a curve is active now, and an observed completion without a recorded migration does not prove migration is still pending. Deployer is the creation event's user and declared_creator is the separate program-declared creator, not metadata creator attribution or a signer/owner verdict. Results descend by exact slot, block transaction index and event ordinal. Cursors bind every filter and the correction generation; repeat all filters. Pages are not frozen snapshots: later backfills can insert behind an already passed position, so restart/reconcile for discovery recovery. Empty data and has_more=false do not prove complete history. Inspect the independent capture window, live watermark and decode gaps; historical_complete and current_curve_state_available remain false. Quantities are raw atom strings. No upstream RPC or metadata document fetch occurs on this route."
      operationId: getTokenLifecycleEvents
      parameters:
        - name: milestone
          in: query
          description: Recorded event kind, not current inventory stage.
          required: false
          schema:
            $ref: "#/components/schemas/LifecycleMilestone"
        - name: mint
          in: query
          description: Exact mint, base-58.
          required: false
          schema:
            type: string
        - name: declared_creator
          in: query
          description: Exact program-declared creation creator, base-58.
          required: false
          schema:
            type: string
        - name: deployer
          in: query
          description: Exact creation-event user, base-58.
          required: false
          schema:
            type: string
        - name: from_slot
          in: query
          description: Inclusive observed slot.
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: to_slot
          in: query
          description: Exclusive observed slot.
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          description: Events per page (default 25).
          required: false
          schema:
            type: integer
            format: int32
            maximum: 100
            minimum: 1
        - name: cursor
          in: query
          description: Opaque query-bound continuation. Repeat all filters.
          required: false
          schema:
            type: string
      responses:
