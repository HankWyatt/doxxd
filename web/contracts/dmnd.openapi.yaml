        metadata_slot:
          type:
            - integer
            - "null"
          format: int64
        mint:
          type: string
        mint_slot:
          type:
            - integer
            - "null"
          format: int64
        name:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/NftInspectionStatus"
        symbol:
          type:
            - string
            - "null"
        token_program:
          type:
            - string
            - "null"
        token_standard:
          type:
            - string
            - "null"
          description: |-
            Metaplex token standard (`non_fungible`, `non_fungible_edition`,
            `programmable_non_fungible`, `programmable_non_fungible_edition`,
            `legacy_edition`, `not_nft`), or `token2022_embedded` /
            `token2022_external` for a Token-2022 NFT whose metadata is in the mint
            or in the account its metadata pointer names.
        update_authority:
          type:
            - string
            - "null"
        uri:
