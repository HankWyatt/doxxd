            - string
            - "null"
          description: SPL mint; null for native SOL.
        signature:
          type: string
        slot:
          type: integer
          format: int64
        transaction_index:
          type: integer
          format: int32
        ui_amount:
          type:
            - string
            - "null"
    WalletActivityKind:
      type: string
      description: Neutral balance-change classification; no transfer, swap or fee inference.
      enum:
        - token_balance_change
        - native_sol_balance_change
    WalletAsset:
      type: object
      description: One mint across all of a wallet's positive token accounts.
      required:
        - mint
        - amount
        - account_count
        - last_slot
      properties:
        account_count:
          type: integer
          format: int64
        amount:
          type: string
