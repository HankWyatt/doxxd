  /wallets/{wallet}/transactions:
    get:
      tags:
        - Wallets
      summary: List whole observed wallet transactions
      description: Pages whole observed transactions with this wallet's net token and native SOL balance changes, successful owner-attributed transfers even when no net change is stored, and transactions observed only as a fee paid by this wallet, including failures. Optional RFC3339 from (inclusive) and to (exclusive) filter block_time before pagination; repeat them on cursor requests. Each transaction includes at most 100 changes, 50 matching indexed DEX executions and 50 explicit attributed transfers, with full counts and truncation flags. Archived pages may be short or empty while has_more is true; follow the opaque cursor to continue the activity scan without skipping fee-only or transfer-only cards. Trades and transfers match the exact transaction signature, slot, index and block time. BisonFi verifies token ownership and transfer authority; Raydium and Byreal CLMM verify their emitted sender and declared input authority; Raydium CPMM and AMM v4 verify the observed input token-account owner, user-to-vault transfer and declared signer; Orca uses the observed input token-account owner after checking the input transfer authority; PumpSwap user swaps verify the input owner, user-to-pool transfer and declared signer; Meteora DLMM verifies the input owner, user-to-reserve transfer and declared user. CPMM, AMM v4, Orca, PumpSwap and DLMM fall back to the fee payer when input owner metadata is absent. Other venues may attribute a trade to its fee payer, so sponsored swaps can appear under the wrong wallet or be absent here. A missing match does not prove there was no swap or transfer because indexing and attribution are incomplete. A self transfer appears once; transfer amounts are instructed atoms, not net received amounts. Multiple DEX executions can belong to one routed swap. Net balance deltas are not classified staking or DeFi actions. The exact network fee and success flag are included only when the requested wallet was the observed payer at the same transaction slot/index and the fee observation is no older than the selected card; null means fee evidence is unavailable. Activity, fees and transfers older than live capture, and pure SOL transactions under a token-only stream, may be absent. With include_compressed_nfts=true, also includes indexed compressed NFT-only transactions and at most 50 exact ownership actions per card, with a full count and truncation flag. NFT actions share one database snapshot with the other sources; their cursor binds both ownership and metadata correction generations and the exact time window, including absent bounds. NFT history remains independently incomplete, and NFT transfers do not establish a sale or price. Leave the flag false to retain legacy cursor behavior. Inspect activity, transfer and compressed NFT coverage; an empty page with incomplete coverage does not prove no activity. Reads DMND's database and verified archive when configured, without an upstream RPC call.
      operationId: getWalletTransactions
      parameters:
        - name: wallet
          in: path
          description: Wallet address (base-58).
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Whole transactions per page (default 10).
          required: false
          schema:
            type: integer
            format: int32
            maximum: 25
            minimum: 1
        - name: cursor
          in: query
          description: Opaque continuation cursor scoped to this wallet and route.
          required: false
          schema:
            type: string
        - name: from
          in: query
          description: RFC3339 block time, inclusive.
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: RFC3339 block time, exclusive.
          required: false
          schema:
            type: string
            format: date-time
        - name: include_compressed_nfts
          in: query
          description: Include indexed compressed NFT-only transactions and exact ownership actions (default false). Repeat on cursor requests.
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Observed wallet transaction page and coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletTransactions"
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: bad_request
                  message: Invalid or missing query parameter
                  request_id: req_9f8c1a2b3d4e5f60a1b2c3d4e5f60718
                  status: 400
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: unauthorized
                  message: Missing or invalid API key.
                  request_id: req_9f8c1a2b3d4e5f60a1b2c3d4e5f60718
                  status: 401
        "403":
          description: The API key is valid but not permitted to do this
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
