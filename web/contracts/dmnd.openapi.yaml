        - last_trade_price_sol
        - last_trade_price_usd
        - price_updated_at
      properties:
        decimals:
          type: integer
          format: int32
          minimum: 0
        last_trade_price_sol:
          type: string
          format: decimal
        last_trade_price_usd:
          type: number
          format: double
        mint:
          type: string
        name:
          type: string
        price_updated_at:
          type: string
          format: date-time
        symbol:
          type: string
    NftInspection:
      type: object
      description: |-
        Finalized mint and on-chain metadata evidence for an uncompressed asset.
        Classification comes from Metaplex Token Metadata when its account exists,
        otherwise from Token-2022 TokenMetadata; `name`, `symbol` and `uri` prefer
        Token-2022 TokenMetadata when the mint has it. `confirmed` verifies the
