  /ohlcv/{pool_address}:
    get:
      tags:
        - OHLCV
      summary: Get OHLCV candles for a pool
      description: Candles at the given resolution, oldest first. The max range per request grows with resolution, from 1h at `1s`, `5s` and `15s` up to 5y at `1d`; over-wide ranges are rejected. Bounds select candle bucket timestamps. Omit price_basis or select execution for unchanged execution-price candles. Explicit post_swap_spot uses source-stated Raydium CLMM post-swap sqrt state with explicit mint orientation/scales for every eligible indexed swap in each selected UTC bucket, at every resolution. Native quote/base OHLC uses canonical slot/transaction/instruction order. Each occupied bucket opens at the immediately preceding indexed priceable swap's qualified post-state, including outside the requested range. The seed participates in high/low but adds no counts or volume; close is the final in-bucket state. An unqualified or ambiguous immediate predecessor refuses the request, never skips back. With no indexed predecessor, open is the first in-bucket state and opening.basis is first_observation_no_indexed_predecessor; this does not prove genesis or complete history. Counts and volumes remain actual in-bucket swaps, excluding liquidity actions. This basis contains no USD, FX, supply or market cap. Missing/invalid spot, ambiguous order or mixed pairs refuse the selected range with 503, never execution fallback or partial candles. Spot requests and execution second-resolution requests exceeding 100000 source trades return 422; request a shorter range. Missing source buckets are omitted, not invented zero bars. These observations do not prove complete chain history.
      operationId: getOhlcv
      parameters:
        - name: pool_address
          in: path
          description: Pool address (base-58).
          required: true
          schema:
            type: string
        - name: resolution
          in: query
          description: Candle resolution.
          required: true
          schema:
            $ref: "#/components/schemas/OhlcvResolution"
        - name: price_basis
          in: query
          description: Omit or execution for unchanged execution candles. post_swap_spot selects source-qualified native pool prices; unavailable spot source never falls back to execution. Opening metadata names the immediate qualified predecessor or absence of an indexed predecessor. Seed affects OHLC only; counts/volumes remain in-bucket swaps. No USD/FX conversion.
          required: false
          schema:
            $ref: "#/components/schemas/OhlcvPriceBasis"
        - name: from
          in: query
          description: Range start, RFC-3339 (inclusive).
          required: true
          schema:
            type: string
        - name: to
          in: query
          description: Range end, RFC-3339 (exclusive).
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Candles, oldest first. Successful post_swap_spot responses include top-level price_basis=post_swap_spot even when data is empty; execution responses omit it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OhlcvResponse"
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: bad_request
                  message: Invalid or missing query parameter
                  request_id: req_9f8c1a2b3d4e5f60a1b2c3d4e5f60718
                  status: 400
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: unauthorized
                  message: Missing or invalid API key.
                  request_id: req_9f8c1a2b3d4e5f60a1b2c3d4e5f60718
                  status: 401
        "403":
          description: The API key is valid but not permitted to do this
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: forbidden
                  message: publishable keys need a paid plan
                  request_id: req_9f8c1a2b3d4e5f60a1b2c3d4e5f60718
                  status: 403
        "422":
          description: The selected candle source exceeds the request limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: too_large
                  message: short candle source exceeds 100000 trades; request a shorter range
                  request_id: req_9f8c1a2b3d4e5f60a1b2c3d4e5f60718
                  status: 422
        "429":
