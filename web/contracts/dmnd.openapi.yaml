        account_count_excluding_lp:
          type:
            - integer
            - "null"
          format: int64
          description: Positive accounts outside pool vaults, shared authorities and burns.
        as_of_slot:
          type:
            - integer
            - "null"
          format: int64
          description: The newest slot whose balances live ingest committed.
        bundlers_pct:
          type:
            - string
            - "null"
          format: decimal
        concentration_at:
          type:
            - string
            - "null"
          format: date-time
        concentration_basis:
