      description: |-
        Fees paid over one range, in SOL and US dollars. Each `_usd` is valued at
        each trade's minute and summed, not `_sol` times `sol_usd`, so it does not
        move with today's SOL price. A part unknown for a trade is left out of the
        sums, never counted as zero.
      required:
        - total_sol
        - pool_sol
        - base_sol
        - priority_sol
        - builder_tips_sol
        - platform_sol
        - trades
        - pool_unknown
        - unpriced
      properties:
        base_sol:
          type: string
          format: decimal
          description: The network base fee, split evenly across a transaction's trades.
        base_usd:
          type:
            - string
            - "null"
          format: decimal
        builder_tips_sol:
          type: string
          format: decimal
          description: |-
            Tips to registered builder and landing service accounts (Jito,
            Nozomi, 0slot and others), split as `base_sol` is. A lower bound:
            private tip wallets are not registered.
        builder_tips_usd:
          type:
            - string
            - "null"
          format: decimal
        fee_to_volume:
          type:
            - number
            - "null"
          format: double
          description: |-
            `total_sol` over the window's SOL volume. Null for `lifetime`, and for
            a window without volume or without fee rows (`trades` 0).
        platform_sol:
          type: string
          format: decimal
          description: |-
            SOL and wrapped SOL sent to registered trading-terminal fee wallets
            (Axiom, Photon and others), split as `base_sol` is.
        platform_usd:
          type:
            - string
            - "null"
          format: decimal
        pool_sol:
          type: string
          format: decimal
          description: |-
            The venue's trading fee (LP, protocol, creator), in SOL at the quote's
            rate at each trade's minute. Byreal fees are estimates, as are
            PancakeSwap fees for a fee config DMND has not mapped.
        pool_unknown:
          type: integer
          format: int64
          description: |-
            Trades whose venue pool fee is not observable (BisonFi, for one), left
            out of `pool_sol`.
        pool_usd:
          type:
            - string
            - "null"
          format: decimal
        priority_sol:
          type: string
          format: decimal
          description: The priority fee paid to the leader, split as `base_sol` is.
        priority_usd:
          type:
            - string
            - "null"
          format: decimal
        total_sol:
          type: string
          format: decimal
          description: "`pool_sol + base_sol + priority_sol + builder_tips_sol + platform_sol`."
        total_usd:
          type:
            - string
            - "null"
          format: decimal
          description: |-
            Sum of known USD components at each trade's minute. Null without a
            SOL/USD rate; known network USD remains available when a pool quote
            rate is missing. Each component is null until its own amount and
            required rates are available.
        trades:
          type: integer
          format: int64
          description: Trades counted.
        unpriced:
          type: integer
          format: int64
          description: |-
            Trades missing a rate at their minute: SOL per USD, left out of the
            `_usd` sums, or their quote's SOL rate, left out of `pool_sol`.
    HistoricalPriceStatus:
      type: string
      enum:
        - priced
        - quote_only
        - no_observation
    HistoricalTokenPrice:
      type: object
      description: A past token price observed in DMND's stored one-minute pool candles.
      required:
        - mint
        - requested_at
        - status
      properties:
        mint:
          type: string
        pool_address:
          type:
            - string
            - "null"
        price_quote:
          type:
            - string
            - "null"
          format: decimal
        price_sol:
          type:
            - string
            - "null"
          format: decimal
        price_usd:
          type:
            - string
            - "null"
          format: decimal
        quote_mint:
          type:
            - string
            - "null"
        quote_rate_bucket:
          type:
            - string
            - "null"
          format: date-time
          description: Source bucket of the quote asset's WSOL pool, if used.
        quote_rate_pool_address:
          type:
            - string
            - "null"
          description: Pool that supplied the quote asset's WSOL rate, if used.
        requested_at:
          type: string
          format: date-time
        sol_usd_bucket:
          type:
            - string
            - "null"
          format: date-time
          description: Source bucket of the stablecoin/WSOL reference, if used.
        sol_usd_pool_address:
          type:
            - string
            - "null"
          description: Pool that supplied the stablecoin/WSOL reference, if used.
        source_bucket:
          type:
            - string
            - "null"
          format: date-time
          description: Start of the last one-minute source candle selected for this pool.
        status:
          $ref: "#/components/schemas/HistoricalPriceStatus"
    HistoricalTokenPrices:
      type: object
      description: Historical observations for a bounded list of mints, in request order.
      required:
        - requested_at
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/HistoricalTokenPrice"
        requested_at:
          type: string
          format: date-time
    HolderBootstrapStatus:
      type: string
      description: |-
        Where the backfill of a mint's older holders stands. A mint older than
        balance tracking is listed from the accounts that changed since, until a
        bootstrap reads every account it holds; a holders read of such a mint asks
        for one. Poll until `done` (then `holders_complete` turns true once the
        count has run).
      enum:
        - queued
        - running
        - done
        - too_large
        - skipped
        - waiting_for_backfill
        - queue_full
    HolderCountStatus:
      type: string
      description: Whether a holder count can be trusted, and if not, why.
      enum:
        - counted
        - pending
        - timed_out
        - skipped
    HolderHistory:
      type: object
      description: |-
        A token's holder counts over time. Only buckets with a count are listed:
        a mint is counted when its balances change, so a gap means no change.
      required:
        - mint
        - resolution
        - from
        - to
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/HolderHistoryPoint"
          description: Oldest first.
        from:
          type: string
          format: date-time
        mint:
          type: string
        resolution:
          $ref: "#/components/schemas/HolderHistoryResolution"
        to:
          type: string
          format: date-time
    HolderHistoryPoint:
      type: object
      description: "A token's holder count in one bucket: the last count taken in it."
      required:
        - bucket
      properties:
        bucket:
          type: string
          format: date-time
          description: The bucket's start.
        holder_count:
          type:
            - integer
            - "null"
          format: int64
        holder_count_excluding_lp:
          type:
            - integer
            - "null"
          format: int64
        top10_amount:
          type:
            - string
            - "null"
          format: decimal
          description: |-
            Raw atoms held by the ten largest accounts outside pool vaults and
            burn addresses.
        total_amount:
          type:
            - string
            - "null"
          format: decimal
          description: Raw atoms over every positive balance.
    HolderHistoryResolution:
      type: string
      description: The bucket width of `GET /tokens/{mint}/holders/history`.
      enum:
        - 5m
        - 1h
        - 1d
    HolderLabel:
      type: string
      description: What a holder is known to be.
      enum:
        - pool_vault
        - burn
        - dev
        - sniper
        - bundler
        - insider
        - coordinated
    HolderLabelEvidence:
      type: object
      description: |-
        Why a holder carries `dev`, `sniper`, `bundler`, `insider` or
        `coordinated`.
      properties:
        bundle:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/BundleEvidence"
              description: "With `bundler`: the run."
        coordinated:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/BundleEvidence"
              description: "With `coordinated`: the run."
        dev_source:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/DevSource"
              description: "With `dev`: where the deployer came from."
        insider_dev_transfer:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/DevTransferEvidence"
              description: |-
                With `insider`: the deployer's transfer it received (the first one
                DMND saw).
        insider_launch_tx:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/LaunchTxEvidence"
              description: "With `insider`: the create transaction it bought in."
        labels_basis:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/LabelsBasis"
              description: "With `sniper`: what the launch slot was read off."
        slots_after_launch:
          type:
            - integer
            - "null"
          format: int64
          description: "With `sniper`: the wallet's first buy, in slots after the launch slot."
        sniper_slots:
          type:
            - integer
            - "null"
          format: int64
          description: "With `sniper`: the window, in slots after the launch slot."
    HolderPercentageBasis:
      type: string
      description: The quantity used as the denominator of a holder percentage.
      enum:
        - mint_supply
    HolderSort:
      type: string
      description: The order of a holders page.
      enum:
        - balance
        - realized_pnl
        - total_pnl
        - bought
        - first_buy
    HolderTradeTotals:
      type: object
      description: |-
        One side of a wallet's trading in the mint, summed over its lifetime (or
        since `positions_since`).
      required:
        - amount
        - sol
        - usd
        - count
      properties:
        amount:
          type: string
          format: decimal
          description: Whole tokens.
        count:
          type: integer
          format: int32
          description: Trades.
        sol:
          type: string
          format: decimal
          description: SOL value at each trade's time.
        usd:
          type: string
          format: decimal
          description: USD value at each trade's time.
    IngestCoverage:
      type: object
      description: |-
        Stored ingest watermarks. Even `caught_up_to_live` does not certify all
        older transactions, venues or decoder versions have been indexed.
      required:
        - status
        - contiguous_slot
        - live_slot
        - fill_through_slot
        - live_ahead_slots
        - contiguous_updated_at
      properties:
        contiguous_slot:
          type:
            - integer
            - "null"
          format: int64
          description: Highest slot of the contiguous indexed ingest frontier.
          minimum: 0
        contiguous_updated_at:
          type:
            - string
            - "null"
          format: date-time
          description: Last time the contiguous frontier advanced; not the live commit time.
        fill_through_slot:
          type:
            - integer
            - "null"
          format: int64
          description: Current boot's gap-fill target, when known.
          minimum: 0
        live_ahead_slots:
          type:
            - integer
            - "null"
          format: int64
          description: "`max(live_slot - contiguous_slot, 0)` when both slots exist."
          minimum: 0
        live_slot:
          type:
            - integer
            - "null"
          format: int64
          description: Latest independently committed live ingest slot; may run ahead during fill.
          minimum: 0
        status:
          $ref: "#/components/schemas/IngestCoverageStatus"
    IngestCoverageStatus:
      type: string
      enum:
        - not_started
        - gap_filling
        - frontier_behind_live
        - live_unavailable
        - caught_up_to_live
    InventoryAccountingCoverage:
      type: object
      required:
        - scope
        - execution_cap
        - indexed_executions
        - economic_observations
        - complete_indexed_trade_read
        - complete_chain_history
        - opening_inventory_known
        - transfer_history_complete
        - fees_included
        - issues
      properties:
        complete_chain_history:
          type: boolean
        complete_indexed_trade_read:
          type: boolean
          description: True only for the exact wallet/mint's currently retained indexed trades.
        economic_observations:
          type: integer
          format: int32
          minimum: 0
        execution_cap:
          type: integer
          format: int32
          minimum: 0
        fees_included:
          type: boolean
        indexed_executions:
          type: integer
          format: int32
          minimum: 0
        issues:
          type: array
          items:
            type: string
        opening_inventory_known:
          type: boolean
        scope:
          type: string
        transfer_history_complete:
          type: boolean
    InventoryAccountingCurrency:
      type: object
      required:
        - observed_matched_amount
        - observed_known_basis_amount
        - observed_unknown_basis_amount
        - observed_remaining_known_cost
      properties:
        observed_known_basis_amount:
          type: string
          description: Priced and unpriced portions of the remaining observed trade inventory.
        observed_matched_amount:
          type: string
        observed_matched_cost:
          type:
            - string
            - "null"
          description: |-
            Cost of the observed, priced inventory matched by this sale. Conditional
            on the indexed trade inventory; does not establish the wallet's full basis.
        observed_matched_gross_pnl:
          type:
            - string
            - "null"
        observed_matched_proceeds:
          type:
            - string
            - "null"
        observed_notional:
          type:
            - string
            - "null"
          description: Known notional for this entire economic observation; null if any fill lacks it.
        observed_remaining_known_cost:
          type: string
        observed_unknown_basis_amount:
          type: string
        qualified_realized_gross_pnl:
          type:
            - string
            - "null"
          description: Null until opening inventory, movements, basis and sale proceeds qualify.
    InventoryAccountingEvent:
      type: object
      required:
        - signature
        - slot
        - transaction_index
        - side
        - quote_mint
        - fills
        - issues
        - observed_remaining_amount
        - observed_unmatched_sale_amount
        - observed_inventory_ambiguous
        - opening_inventory_unknown
        - sol
        - usd
      properties:
        amount_tokens:
          type:
            - string
            - "null"
        fills:
          type: array
          items:
            $ref: "#/components/schemas/InventoryAccountingFill"
        issues:
          type: array
          items:
            type: string
        observed_inventory_ambiguous:
          type: boolean
          description: An earlier/current ambiguous event prevents a complete observed inventory.
        observed_remaining_amount:
          type: string
          description: A trade-only balance, clamped at zero after unmatched sales. Not a holding.
        observed_unmatched_sale_amount:
          type: string
        opening_inventory_unknown:
          type: boolean
          description: Persists through sales, observed exact-flat closure and subsequent buys.
        quote_mint:
          type: string
        side:
          type: string
        signature:
          type: string
        slot:
          type: integer
          format: int64
        sol:
          $ref: "#/components/schemas/InventoryAccountingCurrency"
        transaction_index:
          type: integer
          format: int32
        usd:
          $ref: "#/components/schemas/InventoryAccountingCurrency"
    InventoryAccountingFill:
      type: object
      required:
        - signature
        - slot
        - transaction_index
        - instruction_index
        - block_time
        - side
        - amount_tokens
        - quote_amount
        - quote_mint
        - accepted_trade_fingerprint_sha256
      properties:
