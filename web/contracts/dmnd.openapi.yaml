openapi: 3.1.0
info:
  title: dmnd.dev API
  description: Solana market data over REST. Query trades, pools, tokens, OHLCV candles, and the SOL/USD price. Live events stream over WebSocket, documented in the Streaming API. Authentication is by API key passed as the `api_key` query parameter.
  license:
    name: Proprietary
    identifier: LicenseRef-proprietary
  version: 0.1.0
servers:
  - url: https://api.dmnd.dev/api/v1
    description: Production
  - url: http://localhost:3000/api/v1
    description: Local development
paths:
  /assets/{asset}/compressed-nft/document:
    post:
      tags:
        - Wallets
      summary: Request a bounded background read of an observed compressed NFT URI
      description: Explicitly admits document work for exact retained mint/update coordinates and both correction generations. The asset must match that DMND journal source; requests never supply a URI. The API performs no document, image, RPC or DAS request. A separate worker reads the retained URI with document/time/concurrency/day limits and checks corrections before saving. Admission defaults disabled, applies a global queue cap and a one-hour cooldown. Queued means admitted, not fetched. Result observations are returned on chain inventory and action pages under their mint/update source; they do not verify current chain metadata, historical file contents, image bytes or ownership. Inventory GET requests remain read-only.
      operationId: requestCompressedNftDocument
      parameters:
        - name: asset
          in: path
          description: Observed Bubblegum asset ID (base-58).
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompressedNftDocumentRequest"
        required: true
      responses:
        "200":
          description: Document admission outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompressedNftDocumentRequestResult"
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: bad_request
                  message: Invalid or missing query parameter
                  request_id: req_9f8c1a2b3d4e5f60a1b2c3d4e5f60718
                  status: 400
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: unauthorized
                  message: Missing or invalid API key.
                  request_id: req_9f8c1a2b3d4e5f60a1b2c3d4e5f60718
                  status: 401
        "403":
          description: The API key is valid but not permitted to do this
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: forbidden
                  message: publishable keys need a paid plan
                  request_id: req_9f8c1a2b3d4e5f60a1b2c3d4e5f60718
                  status: 403
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: rate_limited
                  message: Rate limit exceeded.
                  request_id: req_9f8c1a2b3d4e5f60a1b2c3d4e5f60718
                  status: 429
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: internal_error
                  message: An unexpected error occurred.
                  request_id: req_9f8c1a2b3d4e5f60a1b2c3d4e5f60718
                  status: 500
        "503":
          description: A dependency needed to serve the request is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: service_unavailable
                  message: Service temporarily unavailable.
                  request_id: req_9f8c1a2b3d4e5f60a1b2c3d4e5f60718
                  status: 503
  /coverage/ingest:
    get:
      tags:
        - Coverage
      summary: Read stored Solana ingest watermarks
      description: Returns the contiguous indexed frontier, independently committed live slot and current gap-fill target from DMND's database. A live slot ahead of the frontier means newer live facts can be available while the historical range still needs reconciliation. `caught_up_to_live` means only that these stored watermarks meet; it does not prove all earlier transactions, old decoder reindex, DEX venues or wallet/NFT/DeFi datasets are complete. This route never calls upstream RPC.
      operationId: getIngestCoverage
      responses:
        "200":
          description: Stored ingest watermark and narrow gap state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestCoverage"
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: bad_request
