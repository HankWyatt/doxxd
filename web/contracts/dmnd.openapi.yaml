        sol_balance_slot:
          type:
            - integer
            - "null"
          format: int64
        sold_sol:
          type: string
          format: decimal
        sold_usd:
          type: string
          format: decimal
        total_pnl_sol:
          type: string
          format: decimal
          description: Realized plus unrealized.
        total_pnl_usd:
          type: string
          format: decimal
        unpriced_trades:
          type: integer
          format: int64
        unrealized_pnl_sol:
          type: string
          format: decimal
          description: Over the positions whose unrealized PnL is known.
        unrealized_pnl_usd:
          type: string
          format: decimal
        unrealized_unknown:
          type: integer
          format: int64
