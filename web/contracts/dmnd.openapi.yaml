        bought_sol:
          type: string
          format: decimal
        bought_usd:
          type: string
          format: decimal
        buys:
          type: integer
          format: int64
        closed_positions:
          type: integer
          format: int64
          description: Positions that sold and hold nothing now.
        first_trade_at:
          type:
            - string
            - "null"
          format: date-time
        last_active_at:
          type:
            - string
            - "null"
          format: date-time
        open_positions:
          type: integer
          format: int64
          description: Positions with a balance now.
        positions:
          type: integer
          format: int64
          description: Tokens traded.
        positions_since:
          type:
            - string
            - "null"
          format: date-time
        positions_tracked:
          type: boolean
        realized_pnl_sol:
          type: string
          format: decimal
        realized_pnl_usd:
          type: string
          format: decimal
        sells:
          type: integer
          format: int64
        sol_balance:
          type:
            - string
            - "null"
          format: decimal
          description: |-
