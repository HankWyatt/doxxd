                  type:
                    - string
                    - "null"
                decimals:
                  type:
                    - integer
                    - "null"
                  format: int32
                description:
                  type:
                    - string
                    - "null"
                image_url:
                  type:
                    - string
                    - "null"
                metadata_slot:
                  type:
                    - integer
                    - "null"
