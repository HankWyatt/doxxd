    get:
      tags:
        - Wallets
      summary: Read bounded chronological indexed trade inventory accounting
      description: Reads every currently retained indexed execution for this exact wallet and mint, ordered by slot, transaction index, instruction index and signature, then coalesces each transaction. Includes all constituent identities and unknown/ambiguous observations. No launch membership requirement. Refuses above 2,000 executions with 422 and no partial ledger; no pagination. A single read-only repeatable-read snapshot and original accepted conversion receipts pin source_version_sha256; a later read can change after ingestion or correction. Native WSOL establishes SOL notional directly. Other SOL and all USD conversions require original receipts matching the complete accepted trade fingerprint. Currency books independently track known/unknown observed basis. Observed matched cost/proceeds/gross PnL are conditional indexed-trade contributions, not full wallet realized PnL. Opening inventory and transfers remain unknown through observed flat closure/rebuy; qualified realizations and full net PnL remain null. Trade-only gross scope excludes fees and never establishes complete chain history. Fixed request cost 40. Queries have a 3-second statement timeout and the read has a 5-second outer deadline. No RPC, price fetch, queue or writes.
