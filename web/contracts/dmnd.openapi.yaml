  /wallets/{wallet}/velocity-positions:
    get:
      tags:
        - Wallets
      summary: List a wallet's Velocity spot and perpetual exposure
      description: "Pages saved finalized Velocity User accounts authorized by this wallet. Public reads use the database only. Complete coverage verifies the owner inventory. Spot token amounts require a qualified finalized SpotMarket interest snapshot. Optional spot USD components, perp PnL and isolated quote-market collateral require finalized market and State snapshots plus qualified Pyth Lazer oracles where those prices are used; each source carries its context slot and may differ from the User slot by up to 150. Perp PnL uses a qualified exchange or market MM price, or the PerpMarket's fixed expiry price when status is settlement. The mark's kind and key identify the actual source; source and posted_slot are null for settlement because no oracle source or exact settlement write slot is stored. A null valuation with component_unavailable status means a mark was attempted but could not be published. Perp quote PnL uses fixed six-place protocol units regardless of quote mint decimals. With fresh complete owner coverage and a recorded owner inventory context and every required User, market, State and oracle context at the owner snapshot slot, known_equity_usd is the signed USD value across all authority accounts, independent of pagination, and valuation_status is observed_equity. It matches SDK 0.26.0 getFloorNetEquity: spot deposits less borrows, funding-inclusive perp PnL at the primary exchange price or fixed settlement price, and isolated deposits at the live quote price. When a displayed perp component uses a market MM mark, equity_valuation supplies its independently qualified primary-exchange PnL; legacy MM rows without that source keep equity unknown. Conservative isolated collateral component values use a strict TWAP bound and must not be resummed as net equity. The atomic UserStats active-subaccount count must match every captured User in that source batch; matching inventory keys across banks alone cannot prove completeness. inventory_account_count reports the persisted complete account count across all pages; missing rows or a legacy proof keep equity unknown. Legacy accounts with null owner_inventory_slot and missing, opaque, unsupported or cross-slot components leave the total null. Account equity excludes transaction costs, health, liquidation and withdrawal limits and other protocols. An empty first page is a verified zero only when coverage is complete and fresh; invalid or exhausted continuation cursors are rejected."
      operationId: getWalletVelocityPositions
      parameters:
        - name: wallet
          in: path
          description: Wallet address (base-58).
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Page size (default 50).
          required: false
          schema:
            type: integer
            format: int32
            maximum: 100
            minimum: 1
        - name: cursor
          in: query
          description: Opaque owner and snapshot-bound continuation cursor.
