components:
  schemas:
    BundleBasis:
      type: string
      description: What ties a run of buys together.
      enum:
        - from_create
        - jito_tip
        - shared_fee_payer
        - contiguous_only
    BundleEvidence:
      type: object
      description: |-
        The run of buys a `bundler` or `coordinated` holder was found in.
        Transaction indexes are block positions: consecutive ones mean no other
        transaction landed between.
      required:
        - slot
        - transaction_indexes
        - signatures
        - run_length
        - wallets
        - fee_payers
        - jito_tips
        - basis
      properties:
        basis:
          $ref: "#/components/schemas/BundleBasis"
        fee_payers:
          type: integer
          format: int32
          description: Distinct fee payers of the run's transactions.
        jito_tips:
          type: integer
          format: int32
          description: Transactions in the run that paid a Jito tip.
        run_length:
          type: integer
          format: int32
          description: Transactions in the run.
        signatures:
          type: array
          items:
            type:
              - string
              - "null"
          description: Their signatures, in the same order.
        slot:
          type: integer
          format: int64
        transaction_indexes:
          type: array
          items:
            type: integer
            format: int32
          description: The run's transactions, in block order.
        wallets:
          type: array
          items:
            type: string
          description: |-
            The wallets labelled: every owner that received tokens in the run,
            less the deployer, pools and burn addresses (base-58).
    Commitment:
      type: string
      description: |-
        How settled the slot a trade landed in was when DMND sent it.

        - `confirmed`: a supermajority voted on the slot. Every REST row and every
          `trade` frame is Confirmed.
        - `processed`: the slot's block was produced but not yet voted on. Only
          the `trade_processed` channel carries these; a Processed slot can still
          be dropped, which `slot_status` announces.
      enum:
        - processed
        - confirmed
    CompressedNftDocumentObservation:
      type: object
      description: |-
        A metadata-file read at fetched_at, attached only to its exact retained URI.
        This does not certify the file's current or historical contents or image bytes.
      required:
        - scope
        - source_kind
        - asset
        - signature
        - uri
        - slot
        - transaction_index
        - instruction_ordinal
        - owner_generation
        - metadata_generation
        - status
        - fetched_at
        - current_state_verified
        - historical_content_verified
      properties:
        asset:
          type: string
        current_state_verified:
          type: boolean
          description: Always false. File observations do not certify current chain metadata.
        error_code:
          type:
            - string
            - "null"
        fetched_at:
          type: string
          format: date-time
        historical_content_verified:
          type: boolean
          description: Always false. A read now does not establish file content at a past action.
        image_uri:
          type:
            - string
            - "null"
          description: Creator-supplied link observed in the file; image bytes are not inspected.
        instruction_ordinal:
          type: integer
          format: int32
        metadata_generation:
          type: integer
          format: int64
        owner_generation:
          type: integer
          format: int64
        scope:
          type: string
          description: Always offchain_document_observation.
        signature:
          type: string
        slot:
          type: integer
          format: int64
        source_kind:
          $ref: "#/components/schemas/CompressedNftDocumentSourceKind"
        status:
          $ref: "#/components/schemas/CompressedNftDocumentStatus"
        transaction_index:
          type: integer
          format: int32
        uri:
          type: string
    CompressedNftDocumentRequest:
      type: object
      required:
        - source_kind
        - slot
        - transaction_index
        - instruction_ordinal
        - owner_generation
        - metadata_generation
      properties:
        instruction_ordinal:
          type: integer
          format: int32
        metadata_generation:
          type: integer
          format: int64
        owner_generation:
          type: integer
          format: int64
        slot:
          type: integer
          format: int64
        source_kind:
          $ref: "#/components/schemas/CompressedNftDocumentSourceKind"
        transaction_index:
          type: integer
          format: int32
      additionalProperties: false
    CompressedNftDocumentRequestResult:
      type: object
      required:
        - asset
        - status
        - source
      properties:
        asset:
          type: string
        source:
          $ref: "#/components/schemas/CompressedNftDocumentRequest"
        status:
          $ref: "#/components/schemas/CompressedNftDocumentRequestStatus"
    CompressedNftDocumentRequestStatus:
      type: string
      enum:
        - queued
        - unchanged
        - unavailable
        - queue_full
        - disabled
    CompressedNftDocumentSourceKind:
      type: string
      enum:
        - mint
        - metadata_update
    CompressedNftDocumentStatus:
      type: string
      enum:
        - present
        - not_available
        - unavailable
    CountBasis:
      type: string
      description: What `holder_count` counts.
      enum:
        - owners
        - accounts
    CpmmLockerVaultEvidence:
      type: object
      description: |-
        Same-bank balance at Raydium's documented locker ATA. Custody alone does
        not establish permanent lock restrictions, Fee Key ownership or all lockers.
      required:
        - status
        - program
        - authority
        - vault
        - withdrawal_restriction_verified
      properties:
        account_sha256:
          type:
            - string
            - "null"
        authority:
          type: string
        lp_atoms:
          type:
            - string
            - "null"
        program:
          type: string
        status:
          $ref: "#/components/schemas/CpmmLockerVaultStatus"
        vault:
          type: string
        withdrawal_restriction_verified:
          type: boolean
    CpmmLockerVaultStatus:
      type: string
      enum:
        - present
        - not_found
    CpmmLpSupplyEvidence:
      type: object
      description: |-
        Model-derived Raydium CPMM LP supply facts from one finalized bank.
        This does not enumerate burn transactions, custodians or locker deposits.
      required:
        - lp_mint
        - decimals
        - accounted_lp_atoms
        - minted_lp_atoms
        - unissued_initial_lp_atoms
        - supply_gap_lp_atoms
        - inferred_burned_lp_atoms
        - inferred_burned_lp_bps
        - pool_account_sha256
        - lp_mint_account_sha256
      properties:
        accounted_lp_atoms:
          type: string
          description: Protocol withdrawal denominator, including unissued and burned claims.
        decimals:
          type: integer
          format: int32
          minimum: 0
        inferred_burned_lp_atoms:
          type: string
          description: |-
            Supply gap minus the initial reservation, under the pinned CPMM model.
            Ordinary liquidity withdrawals reduce both counters and are excluded.
        inferred_burned_lp_bps:
          type: integer
          format: int32
          description: Inferred burned share of accounted supply, rounded down to basis points.
          minimum: 0
        lp_mint:
          type: string
        lp_mint_account_sha256:
          type: string
        minted_lp_atoms:
          type: string
          description: Actual SPL mint supply in the same bank as the pool account.
        pool_account_sha256:
          type: string
        raydium_locker_vault:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/CpmmLockerVaultEvidence"
              description: |-
                Null on older observations. An absent ATA has explicit not_found status,
                with unknown balance; it does not certify absence of other lockers.
        supply_gap_lp_atoms:
          type: string
          description: Accounted supply minus mint supply, including the initial reservation.
        unissued_initial_lp_atoms:
          type: string
          description: The protocol's initial 100 atoms never issued to a holder.
    CreationCurveEstimate:
      type: object
      description: |-
        Historical initial virtual-reserve valuation. Never a last-trade price,
        current curve-state verdict, execution quote or circulating-supply claim.
      required:
        - kind
        - quote_mint
        - base_decimals
        - quote_decimals
        - virtual_token_reserves
        - virtual_quote_reserves
        - creation_supply_atoms
        - supply_basis
        - price_quote
        - market_cap_quote
        - source_slot
        - source_block_time
        - current_state_verified
      properties:
        base_decimals:
          type: integer
          format: int32
          minimum: 0
        creation_supply_atoms:
          type: string
          description: |-
            Program-declared CreationEvent.token_total_supply in exact raw atoms.
            This is separate from a later mint-account total supply or burn scope.
        current_state_verified:
          type: boolean
        kind:
          $ref: "#/components/schemas/CurveEstimateKind"
        market_cap_quote:
          type: string
          description: price_quote * creation_supply_atoms / 10^base decimals, not circulating supply.
        price_quote:
          type: string
          description: (virtual quote atoms / 10^quote decimals) / (virtual base atoms / 10^base decimals).
        quote_decimals:
          type: integer
          format: int32
          minimum: 0
        quote_mint:
          type: string
          description: |-
            Normalized quote unit. Default/System quote keys mean native SOL in
            this qualified Pump layout and are represented here by WSOL.
        source_block_time:
          type: string
          format: date-time
        source_slot:
          type: integer
          format: int64
        supply_basis:
          $ref: "#/components/schemas/CreationEstimateSupplyBasis"
        virtual_quote_reserves:
          type: string
        virtual_token_reserves:
          type: string
    CreationEstimateSupplyBasis:
      type: string
      enum:
        - creation_event_token_total_supply
    CurveEstimateKind:
      type: string
      enum:
        - curve_estimate
    CurveObservationKind:
      type: string
      enum:
        - created
        - traded
        - completed
        - migrated
    DataResponse_HistoricalTokenPrice:
      type: object
      description: Response envelope wrapping a single value.
      required:
        - data
      properties:
        data:
          type: object
          description: A past token price observed in DMND's stored one-minute pool candles.
          required:
            - mint
            - requested_at
            - status
          properties:
            mint:
              type: string
            pool_address:
              type:
                - string
                - "null"
            price_quote:
              type:
                - string
                - "null"
              format: decimal
            price_sol:
              type:
                - string
                - "null"
              format: decimal
            price_usd:
              type:
                - string
                - "null"
              format: decimal
            quote_mint:
              type:
                - string
                - "null"
            quote_rate_bucket:
              type:
                - string
                - "null"
              format: date-time
              description: Source bucket of the quote asset's WSOL pool, if used.
            quote_rate_pool_address:
              type:
                - string
                - "null"
              description: Pool that supplied the quote asset's WSOL rate, if used.
            requested_at:
              type: string
              format: date-time
            sol_usd_bucket:
              type:
                - string
                - "null"
              format: date-time
              description: Source bucket of the stablecoin/WSOL reference, if used.
            sol_usd_pool_address:
              type:
                - string
                - "null"
              description: Pool that supplied the stablecoin/WSOL reference, if used.
            source_bucket:
              type:
                - string
                - "null"
