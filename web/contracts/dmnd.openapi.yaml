  /tokens/{mint}:
    get:
      tags:
        - Tokens
      summary: Get a token
      description: |-
        SPL token stats (`kind: spl`) or native SOL (`kind: native`). SPL `volume_*`, `buy_volume_*` and `sell_volume_*` are decimal-adjusted SOL amounts, summed over pools whose base mint is this token and whose quote asset has an eligible SOL conversion. Buy/sell direction is relative to the pool's base token; pools where this token is only the quote are not inverted into these aggregates. The same snapshot quote rate converts each pool's total, buy and sell volume; these are not historical trade-time conversions. Multiplying by `sol_usd` gives a read-time USD estimate, not historical USD volume.

        Fresh volume and trade-count windows include candle buckets from `trade_window_snapshot.window_*_start` through the snapshot's `as_of`, with inclusive bucket-start comparisons. Starts round down to 1-minute buckets for 5M, 5-minute buckets for 1H, and hourly buckets for 6H and 24H; they are longer than exact rolling durations by up to one bucket. Only committed candles visible in that database snapshot are read. Unpriced trades are excluded from both normalized volumes and counts; `unpriced_trades_24h` reports excluded accepted trades in the expanded 24H window. Makers and price-change projections have separate refresh schedules.

        `pool_count` counts base-side pools with eligible SOL conversion, while `unpriced_pools` counts base-side pools without it; it is not a subset of `pool_count`, and both include pools outside the trade windows. Liquidity additionally requires known liquidity and excludes pools whose reserves and last trade are both older than 24 hours. The token pool list can include other roles, quotes and pages, so a partial page is not an aggregate reconciliation. See [Reading token statistics](/token-statistics) for examples and holder coverage semantics.
