        complete:
          type: boolean
          description: Remains false until historical replay and overlap are qualified.
        first_unindexed_slot:
          type:
            - integer
            - "null"
          format: int64
        forward_since_slot:
          type:
            - integer
            - "null"
          format: int64
        fresh:
          type: boolean
          description: Owner capture freshness only; does not certify metadata freshness.
        generation:
          type: integer
          format: int64
        live_slot:
          type:
            - integer
            - "null"
          format: int64
        live_updated_at:
          type:
            - string
            - "null"
          format: date-time
        metadata_update_generation:
          type: integer
          format: int64
          description: Metadata correction generation. Cursors bind both independent generations.
        metadata_updates:
          $ref: "#/components/schemas/WalletCompressedNftMetadataCoverage"
        reason:
          type: string
        replay_through_slot:
          type:
            - integer
            - "null"
          format: int64
        scope:
          type: string
        source:
          type: string
        total_assets:
          type: integer
          format: int64
          description: Currently observed assets for this owner, not a proven wallet total.
    WalletCompressedNft:
      type: object
