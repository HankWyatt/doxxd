  /coverage/wallet-history:
    get:
      tags:
        - Coverage
      summary: Read stored owner-aware archive backfill progress
      description: "Reports committed full-block, owner-aware wallet-history reindex job ranges clipped to the requested inclusive slot bounds, plus unresolved failed slots. Request at most 10,000,000 slots at a time. Ranges can overlap and may have failed slots inside them; a failed slot is a hole until an owner-aware retry reads or confirms it skipped. More than 100 matching job ranges or failed slots are truncated with separate flags. This is historical reindex evidence only: it does not prove genesis-to-head coverage, uninterrupted live capture, all protocols, cold retention or that an arbitrary wallet's old page is complete. This route never calls upstream RPC."
      operationId: getWalletHistoryReindexCoverage
      parameters:
        - name: from_slot
          in: query
          description: First Solana slot, inclusive.
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: to_slot
          in: query
          description: Last Solana slot, inclusive.
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: Stored owner-aware archive processing spans and unresolved holes
          content:
            application/json:
              schema:
