  /tokens/{mint}/top-traders:
    get:
      tags:
        - Tokens
      summary: List a token's top traders
      description: |-
        Every wallet that traded the token, ranked by `sort` (largest first, in SOL at each trade's time): `realized_pnl` (the default), `total_pnl` (realized plus the held tokens at the current price; wallets whose total is unknown rank last), `volume` (bought plus sold), `bought` or `sold`. Each row has a holders row's trading, PnL and labels, and the wallet's balance in all indexed positive accounts owned by the exact wallet/mint, including non-associated accounts.

        A trader is the wallet attributed by its indexed trades, from `positions_since` on. Some venues verify token ownership; others use the fee payer as a proxy. `total_pnl` ranks on every indexed account the wallet holds of the mint; returned rows use the same owned-account scope. This is not a complete arbitrary-wallet scan. The required owner index being absent or invalid answers 503 `wallet_holdings_unavailable`. A page whose wallets own more than 20,000 positive token accounts answers 422; reduce the page size to request fewer wallets.

        Every order is computed over all of the token's positions, so it answers 422 `too_large` for a token with more than 100,000 of them (`total_pnl` also above 100,000 accounts holding it), a refusal kept for 60 s.

        The error message identifies indexed trader positions or positive holding token accounts and the threshold; neither is a distinct holder-owner count. Reducing `limit` does not change these full-ranking limits. No bounded time range is supported by this route.

        A ranking is computed once per token and order every 5 s, and each page is cut from it; every request costs 15 rate-limit tokens whatever its `limit`. Rankings move with trades and prices, so a walk spanning more than 5 s can skip or repeat a wallet across pages.
      operationId: getTokenTopTraders
      parameters:
        - name: mint
          in: path
          description: Token mint (base-58).
          required: true
          schema:
            type: string
        - name: sort
          in: query
          description: Order (default `realized_pnl`).
          required: false
          schema:
            $ref: "#/components/schemas/TopTraderSort"
        - name: limit
          in: query
          description: Page size (default 100).
          required: false
          schema:
            type: integer
            format: int32
            maximum: 500
            minimum: 1
        - name: cursor
          in: query
          description: Cursor from the previous page. Omit for the first page.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Page of traders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopTraders"
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: bad_request
                  message: Invalid or missing query parameter
                  request_id: req_9f8c1a2b3d4e5f60a1b2c3d4e5f60718
