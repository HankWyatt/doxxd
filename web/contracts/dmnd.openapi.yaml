          format: int32
        signature:
          type: string
        slot:
          type: integer
          format: int64
        transaction_index:
          type: integer
          format: int32
    SupplySource:
      type: string
      description: Where `supply` came from.
      enum:
        - balances
        - metadata
    TokenChartResolution:
      type: string
      description: |-
