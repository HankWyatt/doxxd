          in: query
          description: Continue the same scope/filters at the frozen ledger revision.
          required: false
          schema:
            type: string
        - name: min_revision
          in: query
          description: Recovery floor from a qualified history hint. Stale replicas refuse.
          required: false
          schema:
            type: integer
            format: int64
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
