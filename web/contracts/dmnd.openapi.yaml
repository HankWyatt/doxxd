  /tokens/holders/stats:
    get:
      tags:
        - Tokens
      summary: Get current holder statistics for up to 25 tokens
      description: Exact REST seed and recovery snapshot for token_holder_stats. Materializes a bounded coherent DMND projection under short per-mint publication ownership, commits its publication generation/revision, then returns it in requested mint order. REST and WebSocket share that revision fence; a busy mint returns a bounded retryable source error. Compare canonical decimal publication revisions only within the same mint/generation, discard older REST seeds, and invalidate/resync on generation changes. No balance or holder recount is performed by the request. Unknown mints remain rows with null counts and pending status. A count is a lower bound while holders_complete is false, and may be null while pending, timed out or skipped. `count_basis` identifies whether both `holder_count` and `holder_count_excluding_lp` count owners or token accounts. `account_count` and `account_count_excluding_lp` remain account-based; `owner_count` and `owner_count_excluding_lp` are stored owner observations. The selected basis can change between reads, so compare counts on the same basis and inspect source currentness. Concentrations carry their own supply, observation time, slot and completeness; null classification shares mean unavailable evidence, while zero is a measured zero share in that observed inventory. Native SOL and WSOL are excluded. No request-time upstream RPC.
      operationId: getTokenHolderStatsBatch
      parameters:
        - name: mints
          in: query
          description: 1 to 25 distinct SPL or Token-2022 mint addresses, comma-separated. Native SOL is excluded.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Holder statistics in request order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenHolderStatsBatch"
        "400":
          description: Invalid request parameters
