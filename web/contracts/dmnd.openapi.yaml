      properties:
        amount:
          $ref: "#/components/schemas/WalletVelocitySpotAmount"
        strict_twap_price:
          type: string
          description: Quote SpotMarket's five-minute oracle TWAP in 1e6 USD-per-token price precision; strict margin collateral uses the lower of this and the live oracle price.
        valuation:
          $ref: "#/components/schemas/WalletVelocityValuation"
    WalletVelocityOracleKind:
      type: string
      enum:
        - exchange
        - market_mm
        - settlement
    WalletVelocityOracleMark:
      type: object
      required:
        - kind
        - key
        - source
        - price
        - posted_slot
        - context_slot
      properties:
        context_slot:
          type: integer
          format: int64
        key:
          type: string
          description: Oracle account key for `exchange`; PerpMarket PDA for `market_mm` or `settlement`.
        kind:
          $ref: "#/components/schemas/WalletVelocityOracleKind"
          description: "`exchange` for a Pyth Lazer account, `market_mm` or `settlement` for a price stored in the PerpMarket account."
        posted_slot:
          type:
            - integer
            - "null"
          format: int64
          description: Oracle or MM publication slot; null when the settlement write slot is unavailable.
          minimum: 0
        price:
          type: string
          description: Price in USD micro-units.
        source:
          type:
            - integer
            - "null"
          format: int32
          description: Velocity oracle source; null for a fixed settlement price.
          minimum: 0
    WalletVelocityPerp:
      type: object
      description: Exact raw Velocity perp quantities from a finalized User account.
      required:
        - slot
        - market_index
        - last_cumulative_funding_rate
        - base_asset_amount
        - quote_asset_amount
        - quote_break_even_amount
        - quote_entry_amount
        - open_bids
        - open_asks
        - settled_pnl
        - isolated_position_scaled_balance
        - max_margin_ratio
        - open_orders
        - position_flag
        - opaque_layout_evidence
        - base_ui_amount
        - quote_ui_amount
        - valuation
        - valuation_status
        - equity_valuation
        - isolated_collateral
        - isolated_collateral_status
      properties:
        base_asset_amount:
          type: string
        base_ui_amount:
          type: string
          description: Exact base amount at 1e9 precision; not a priced exposure.
        equity_valuation:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/WalletVelocityValuation"
              description: Qualified primary-exchange PnL for SDK account equity when the displayed valuation uses a market MM mark; otherwise null.
        isolated_collateral:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/WalletVelocityIsolatedCollateral"
              description: Quote-market deposit backing this isolated position, separately valued from perp PnL.
        isolated_collateral_status:
          type: string
        isolated_position_scaled_balance:
          type: string
        last_cumulative_funding_rate:
          type: string
        market_index:
          type: integer
          format: int32
          minimum: 0
        max_margin_ratio:
          type: integer
          format: int32
          minimum: 0
        opaque_layout_evidence:
          type: boolean
        open_asks:
          type: string
        open_bids:
          type: string
        open_orders:
          type: integer
          format: int32
          minimum: 0
        position_flag:
          type: integer
          format: int32
          minimum: 0
        quote_asset_amount:
          type: string
        quote_break_even_amount:
          type: string
        quote_entry_amount:
          type: string
        quote_ui_amount:
          type: string
          description: Exact quote amount at 1e6 precision; not USD equity.
        settled_pnl:
          type: string
        slot:
          type: integer
          format: int32
          minimum: 0
        valuation:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/WalletVelocityValuation"
              description: Oracle-marked PnL component, never a whole-wallet equity total.
        valuation_status:
          type: string
    WalletVelocityPosition:
      type: object
      required:
        - position_account
        - owner_inventory_slot
        - snapshot_slot
        - spots
        - perps
      properties:
        owner_inventory_slot:
          type:
            - integer
            - "null"
          format: int64
          description: Exact owner inventory context; null for legacy rows. Required to equal snapshot_slot for account equity.
        perps:
          type: array
          items:
            $ref: "#/components/schemas/WalletVelocityPerp"
        position_account:
          type: string
        snapshot_slot:
          type: integer
          format: int64
        spots:
          type: array
          items:
            $ref: "#/components/schemas/WalletVelocitySpot"
    WalletVelocityPositions:
      type: object
      required:
        - wallet
        - protocol
        - data
        - has_more
        - inventory_account_count
        - valuation_status
        - coverage
      properties:
        coverage:
          $ref: "#/components/schemas/WalletDefiCoverage"
        cursor:
          type:
            - string
            - "null"
        data:
          type: array
          items:
            $ref: "#/components/schemas/WalletVelocityPosition"
        has_more:
          type: boolean
        inventory_account_count:
          type:
            - integer
            - "null"
          format: int32
          description: Proven complete User account count at coverage.snapshot_slot, independent of this page. Null for legacy or missing inventory proof.
          minimum: 0
        known_equity_usd:
          type:
            - string
            - "null"
          description: |-
            Oracle-marked net assets across every saved authority User account,
            only with fresh complete inventory and qualified same-slot sources.
            Includes funding and live-price isolated deposits; excludes other
            protocols, transaction execution costs, liquidation and withdrawal limits.
            Uses coverage.snapshot_slot, and is independent of page size.
        protocol:
          type: string
        valuation_status:
          type: string
        wallet:
          type: string
    WalletVelocitySpot:
      type: object
      description: Velocity spot scaled balance with an optional qualified token amount.
      required:
        - slot
        - market_index
        - balance_type
        - scaled_balance
        - open_bids
        - open_asks
        - cumulative_deposits
        - open_orders
        - opaque_layout_evidence
        - amount
        - amount_status
        - valuation
        - valuation_status
      properties:
        amount:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/WalletVelocitySpotAmount"
              description: Null until the worker saves a qualified SpotMarket snapshot.
        amount_status:
          type: string
        balance_type:
          type: string
        cumulative_deposits:
          type: string
        market_index:
          type: integer
          format: int32
          minimum: 0
        opaque_layout_evidence:
          type: boolean
        open_asks:
          type: string
        open_bids:
          type: string
        open_orders:
          type: integer
          format: int32
          minimum: 0
        scaled_balance:
          type: string
        slot:
          type: integer
          format: int32
          minimum: 0
        valuation:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/WalletVelocityValuation"
              description: Oracle-marked spot component, separate from protocol equity.
        valuation_status:
          type: string
    WalletVelocitySpotAmount:
      type: object
      required:
        - mint
        - decimals
        - token_atoms
        - ui_amount
        - market_snapshot_slot
        - snapshot_relation
      properties:
        decimals:
          type: integer
          format: int32
          minimum: 0
        market_snapshot_slot:
          type: integer
          format: int64
        mint:
          type: string
        snapshot_relation:
          type: string
          description: "`same_slot` only when User and SpotMarket snapshots share a finalized slot."
        token_atoms:
          type: string
        ui_amount:
          type: string
    WalletVelocityValuation:
      type: object
      required:
        - usd_atoms
        - usd_ui
        - pnl_quote_atoms
        - pnl_quote_ui
        - market_snapshot_slot
        - quote_market_snapshot_slot
        - quote_decimals
        - state_snapshot_slot
        - oracle
        - quote_oracle
      properties:
        market_snapshot_slot:
          type: integer
          format: int64
        oracle:
          $ref: "#/components/schemas/WalletVelocityOracleMark"
        pnl_quote_atoms:
          type:
            - string
            - "null"
        pnl_quote_ui:
          type:
            - string
            - "null"
        quote_decimals:
          type:
            - integer
            - "null"
          format: int32
          description: Perp quote PnL uses six decimal protocol precision, regardless of the quote token mint decimals.
          minimum: 0
        quote_market_snapshot_slot:
          type:
            - integer
            - "null"
          format: int64
        quote_oracle:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/WalletVelocityOracleMark"
        state_snapshot_slot:
          type: integer
          format: int64
        usd_atoms:
          type: string
          description: Signed USD micro-units. This is one position component, not wallet equity.
        usd_ui:
          type: string
  securitySchemes:
    api_key:
      type: apiKey
      in: query
      name: api_key
security:
  - api_key: []
tags:
  - name: Coverage
    description: Stored ingest progress and known data gaps.
  - name: Tokens
    description: Token listing, search, and detail.
  - name: Pools
    description: Pool listing, search, and detail.
  - name: Trades
    description: Trade history by pool, token, or wallet.
  - name: Wallets
    description: Wallet assets, activity, positions and PnL.
  - name: OHLCV
    description: Price and volume candles for a pool.
  - name: Price
    description: Current SOL/USD price.
