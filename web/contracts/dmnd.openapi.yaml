          type:
            - boolean
            - "null"
          description: Membership flag bound to this observation; not current collection state.
        creator_hash:
          type: string
          description: Base58 Keccak creator hash emitted by that leaf event.
        creators:
          type: array
          items:
            $ref: "#/components/schemas/WalletCompressedNftObservedCreator"
        current_state_verified:
          type: boolean
          description: Always false; this observation does not certify current metadata state.
        data_hash:
          type: string
          description: Base58 Keccak metadata hash emitted by the update's leaf event.
        document_observation:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/CompressedNftDocumentObservation"
              description: Optional file read at fetched_at; not historical content at this update.
        instruction_ordinal:
          type: integer
          format: int32
        is_mutable:
          type: boolean
        leaf_hash:
          type: string
          description: Base58 leaf node hash. This observation is not an independent Merkle proof.
        name:
          type: string
        nonce:
          type: string
        owner_at_update:
          type: string
        primary_sale_happened:
          type: boolean
        royalty_input_mode:
          $ref: "#/components/schemas/WalletCompressedNftRoyaltyInputMode"
        scope:
          type: string
          description: Always metadata_update_observation. Source continuity is not established.
        seller_fee_basis_points:
          type:
            - integer
            - "null"
          format: int32
          description: Null for inherited royalties; the effective collection rate is unknown.
        seller_fee_basis_points_input:
          type: integer
          format: int32
        signature:
          type: string
        slot:
