            pool:
              type: string
            program:
              type:
                - string
                - "null"
            supported:
              type: boolean
              description: An admitted observed model, not current-epoch or all-layout coverage.
    DataResponse_PoolLiquidityState:
      type: object
      description: Response envelope wrapping a single value.
      required:
        - data
      properties:
        data:
          type: object
          required:
            - pool
