          format: int64
        concentration_source_generation:
          type:
            - string
            - "null"
        concentration_source_revision:
          type:
            - string
            - "null"
        concentration_supply:
          type:
            - string
            - "null"
          format: decimal
        consistent_through_slot:
          type:
            - integer
            - "null"
          format: int64
          description: Every slot through this one is indexed.
        count_basis:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/CountBasis"
              description: |-
                Basis of both holder_count and holder_count_excluding_lp. Owners when
