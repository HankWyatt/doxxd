  /tokens/{mint}/holders:
    get:
      tags:
        - Tokens
      summary: List holders of a token
      description: |-
        The mint's token accounts with a positive balance, largest first, with each one's share of supply, value and labels (pool vault, burn, dev, sniper). The first page is the top holders. `supply_basis: mint_supply` identifies observed issued mint supply; a missing, zero or row-exceeding denominator yields a null share. The saved supply can be older than the row. Concentrations use their independent saved `concentration_supply`, `concentration_at` and `concentration_slot`; neither time nor slot certifies mint RPC freshness. `concentration_complete` separately qualifies that recount's account coverage. Legacy unqualified concentrations are null until recount.

        Each row also carries the owner's trading in the mint: what it bought and sold (amount, SOL and USD at each trade's time, count), average buy and sell prices, realized, unrealized and total PnL by average cost, tokens received by transfer, its first buy, its SOL balance and when it last traded anything. Trading is read off trades attributed to the owner, from `positions_since` on; some venues still use the fee payer as a proxy. `dev` is the wallet that launched the token (`dev_source: deployer`), or its metadata's creator when DMND did not see the launch; `sniper` is a first buy within `sniper_slots` slots of `launch_slot`, and is given only when `labels_basis` says where the launch slot came from.

        Balances come from every block since DMND switched them on. A mint created since then is complete (`holders_complete: true`); for an older mint, accounts that have not changed since are missing, so the counts are lower bounds. Reading an older mint queues a bootstrap that reads all of its accounts; `bootstrap` says where it stands (`queued`, `running`, `done`, `too_large`, `skipped`; `waiting_for_backfill` while ingest catches up after a gap, `queue_full` when too many mints wait, neither of which queues anything). Poll queued/running work until it is `done` and `holders_complete` is true. `too_large` and `skipped` do not complete through ordinary polling: the bounded bootstrap stopped or was deliberately excluded. USDC and USDT are excluded from counting and bootstrap. An increasing observed count does not establish bootstrap progress. Rows are token accounts: an owner with two accounts for the mint appears twice. WSOL is not tracked.

        Labels from the launch go to the wallets that received tokens, never to a fee payer for paying. `bundler` received tokens in a run of buys that landed back to back in one slot of the 150-slot launch window, when the run starts at the create, one Jito tip pays for it, or one fee payer bought for several of its wallets; `coordinated` is such a run of at least 4 buys by 4 wallets with nothing tying it together (it may be independent snipers); `insider` received tokens in the create transaction without being the deployer, or received the token from the deployer by a transfer within 24 h of the launch. `label_evidence` says which, and where; `launch_labelled_at` is null until the window is labelled, about a minute after the launch. The header carries the shares of supply the top 50 and 100 accounts, the dev, snipers, bundlers and insiders hold (the last three null until the launch is labelled). A labelled launch alone does not guarantee percentages: they also require a qualifying launch/mint anchor, valid observed supply and a completed holder recount. Null means unavailable evidence; zero is a measured zero share in the observed inventory, qualified by coverage. Concentrations are refreshed by bounded background recounts on a 30-second scheduler; queues and timeout backoff can delay an individual mint, so this is not a per-mint freshness guarantee. Compare concentration provenance before reconciling a cached percentage with a later holders page.

        `sort` orders by `balance` (the default), `realized_pnl`, `total_pnl` (SOL, largest first), `bought` (tokens, most first) or `first_buy` (earliest first); `label` keeps one label's holders. Both read every account of the mint, so a mint with more than 100,000 accounts answers 422 `too_large` for either; `balance` with no label always pages.
      operationId: getTokenHolders
      parameters:
        - name: mint
          in: path
          description: Token mint (base-58).
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Page size (default 100).
          required: false
          schema:
            type: integer
            format: int32
            maximum: 1000
            minimum: 1
        - name: cursor
          in: query
          description: Cursor from the previous page. Omit for the first page.
          required: false
          schema:
            type: string
        - name: min_amount
          in: query
          description: Smallest balance to list, in raw atoms (an integer).
          required: false
          schema:
            type: string
        - name: sort
          in: query
          description: Order of the page (default `balance`). Any other order, on a mint with more than 100,000 accounts, is 422 `too_large`.
          required: false
          schema:
            $ref: "#/components/schemas/HolderSort"
        - name: label
          in: query
          description: Only holders carrying this label. On a mint with more than 100,000 accounts, 422 `too_large`.
          required: false
          schema:
            $ref: "#/components/schemas/HolderLabel"
      responses:
        "200":
          description: Page of holders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenHolders"
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: bad_request
                  message: Invalid or missing query parameter
                  request_id: req_9f8c1a2b3d4e5f60a1b2c3d4e5f60718
                  status: 400
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: unauthorized
                  message: Missing or invalid API key.
                  request_id: req_9f8c1a2b3d4e5f60a1b2c3d4e5f60718
                  status: 401
        "403":
          description: The API key is valid but not permitted to do this
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: forbidden
                  message: publishable keys need a paid plan
                  request_id: req_9f8c1a2b3d4e5f60a1b2c3d4e5f60718
                  status: 403
        "422":
          description: The mint has too many accounts to sort or filter (`too_large`)
          content:
