  /pools:
    get:
      tags:
        - Pools
      summary: List pools
      description: |-
        Pools of one quote asset ranked by the chosen sort criterion: wrapped SOL unless `quote_mint` names another. Volumes are in each pool's quote asset, so pools of two quotes are never ranked against each other. `sort_by=liquidity` ranks by `liquidity_quote`, which within one quote is the order of `liquidity_sol`; pools whose reserves are not known yet rank last, and pools whose reserves were read more than 24 hours ago and that have not traded in 24 hours are left out.

        With `mint`, the pools whose base is that token instead, against every quote unless `quote_mint` names one: the rows `GET /tokens/{mint}/pools` lists, without its `is_price_pool`.

        Screening thresholds apply before pagination. Volume and liquidity are in each pool's quote asset; use `quote_mint` to compare one unit across pools. A liquidity threshold excludes pools with unknown or stale reserves.

        With `addresses`, the statistics for exactly the pools named instead: in the order named, unranked, as one page with no cursor. A named pool with no statistics is left out, whatever its quote. `addresses` cannot be combined with `sort_by`, `order`, `limit`, `cursor`, `quote_mint`, `mint`, or screening filters.
      operationId: listPools
      parameters:
        - name: sort_by
          in: query
          description: Sort field (default `volume_24h`).
          required: false
          schema:
            $ref: "#/components/schemas/PoolSortBy"
        - name: order
          in: query
          description: Sort direction (default `desc`).
          required: false
          schema:
            $ref: "#/components/schemas/SortOrder"
        - name: limit
          in: query
          description: Page size (default 50).
          required: false
          schema:
            type: integer
            format: int32
            maximum: 200
            minimum: 1
        - name: cursor
          in: query
          description: Cursor from the previous page. Omit for the first page.
          required: false
          schema:
            type: string
        - name: addresses
          in: query
          description: Comma-separated pool addresses (base-58), 1 to 100, no repeats. Returns those pools only.
          required: false
          schema:
            type: string
        - name: quote_mint
          in: query
          description: Rank only pools quoted in this mint (base-58). Default wrapped SOL, `So11111111111111111111111111111111111111112`, unless `mint` is given.
          required: false
          schema:
            type: string
        - name: mint
          in: query
          description: Rank only pools whose base is this mint (base-58), against every quote unless `quote_mint` names one.
          required: false
          schema:
            type: string
        - name: min_volume_24h_quote
          in: query
          description: Minimum observed 24h volume in the pool's quote units, as a nonnegative decimal string.
          required: false
          schema:
            type: string
        - name: min_trades_24h
          in: query
          description: Minimum observed 24h trade count.
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: min_liquidity_quote
          in: query
          description: Minimum known, nonstale liquidity in the pool's quote units, as a nonnegative decimal string.
          required: false
          schema:
            type: string
        - name: exchange
          in: query
          description: Exact indexed venue identifier, 1–64 letters, digits or underscores.
          required: false
          schema:
            type: string
        - name: pool_type
          in: query
          description: "Indexed pool mechanism: bonding_curve, amm, clmm, dlmm or pmm."
          required: false
          schema:
            $ref: "#/components/schemas/PoolType"
      responses:
        "200":
          description: Page of pools
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page_PoolStats"
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: bad_request
                  message: Invalid or missing query parameter
                  request_id: req_9f8c1a2b3d4e5f60a1b2c3d4e5f60718
                  status: 400
        "401":
          description: Missing or invalid API key
          content:
