                    Null for other statuses; see `error` for stored snapshot failures.
            status:
              $ref: "#/components/schemas/TokenSecurityStatus"
            token_program:
              type:
                - string
                - "null"
              description: "`spl_token` or `token_2022`, when a valid mint was read."
            total_supply:
              type:
                - string
                - "null"
              description: Raw atoms encoded as decimal text.
            transfer_fee:
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/TransferFeeSchedule"
            transfer_hook_authority:
              type:
                - string
                - "null"
            transfer_hook_program_id:
              type:
                - string
                - "null"
    DataResponse_Vec_TokenOhlcvBar:
      type: object
      description: Response envelope wrapping a single value.
      required:
        - data
      properties:
        data:
          type: array
          items:
            type: object
            description: |-
              One token chart candle from the selected reference pool for its bucket.
              Converted SOL/USD OHLC uses one historical rate sampled by the bucket's
              end. The converted high and low are projections of quote-price extrema,
              not extrema of every intra-bucket SOL/USD trade price.
            required:
              - bucket
              - pool_address
              - quote_mint
              - open_quote
              - high_quote
              - low_quote
              - close_quote
              - sol_conversion_status
              - usd_conversion_status
              - volume_tokens
              - volume_quote
              - trade_count
              - all_pool_volume_tokens
              - all_pool_known_volume_sol
              - all_pool_known_volume_usd
              - all_pool_trade_count
              - all_pool_unpriced_sol_pools
              - all_pool_unpriced_usd_pools
              - all_pool_unpriced_sol_trade_count
              - all_pool_unpriced_usd_trade_count
              - all_pool_unpriced_sol_volume_tokens
              - all_pool_unpriced_usd_volume_tokens
            properties:
              all_pool_known_volume_sol:
                type: string
                format: decimal
                description: Quote volume converted to SOL where a historical rate is known.
              all_pool_known_volume_usd:
                type: string
                format: decimal
                description: Quote volume converted to USD where a historical rate is known.
              all_pool_trade_count:
                type: integer
                format: int64
                description: Trades across all eligible observed pools in this bucket.
              all_pool_unpriced_sol_pools:
                type: integer
                format: int64
                description: Pool candles with positive quote volume but no SOL conversion.
              all_pool_unpriced_sol_trade_count:
                type: integer
                format: int64
                description: |-
                  Observed trades excluded from known SOL volume because their quote
                  conversion is unavailable; included in all_pool_trade_count.
              all_pool_unpriced_sol_volume_tokens:
                type: string
                format: decimal
                description: |-
                  Base-token volume of pools excluded from known SOL volume. This is
                  not an estimate of the unknown SOL value.
              all_pool_unpriced_usd_pools:
                type: integer
                format: int64
                description: Pool candles with positive quote volume but no USD conversion.
              all_pool_unpriced_usd_trade_count:
                type: integer
                format: int64
                description: |-
                  Observed trades excluded from known USD volume because their quote
                  conversion is unavailable; included in all_pool_trade_count.
              all_pool_unpriced_usd_volume_tokens:
                type: string
                format: decimal
                description: |-
                  Base-token volume of pools excluded from known USD volume. This is
                  not an estimate of the unknown USD value.
              all_pool_volume_tokens:
                type: string
                format: decimal
                description: Base-token volume across all eligible observed pools in this bucket.
              bucket:
                type: string
                format: date-time
              close_quote:
                type: string
                format: decimal
              close_sol:
                type:
                  - string
                  - "null"
                format: decimal
                description: Quote close converted at the historical bucket-end rate.
              close_usd:
                type:
                  - string
                  - "null"
                format: decimal
                description: Quote close converted at the historical bucket-end rate.
              high_quote:
                type: string
                format: decimal
              high_sol:
                type:
                  - string
                  - "null"
                format: decimal
                description: Quote high projected at one bucket-end rate; not an intra-bucket SOL high.
              high_usd:
                type:
                  - string
                  - "null"
                format: decimal
                description: Quote high projected at one bucket-end rate; not an intra-bucket USD high.
              low_quote:
                type: string
                format: decimal
              low_sol:
                type:
                  - string
                  - "null"
                format: decimal
                description: Quote low projected at one bucket-end rate; not an intra-bucket SOL low.
              low_usd:
                type:
                  - string
                  - "null"
                format: decimal
                description: Quote low projected at one bucket-end rate; not an intra-bucket USD low.
              open_quote:
                type: string
                format: decimal
              open_sol:
                type:
                  - string
                  - "null"
                format: decimal
                description: Quote open projected using the historical rate sampled by bucket end.
              open_usd:
                type:
                  - string
                  - "null"
                format: decimal
                description: Quote open projected using the historical rate sampled by bucket end.
              pool_address:
                type: string
              quote_mint:
                type: string
              quote_rate_bucket:
                type:
                  - string
                  - "null"
                format: date-time
              quote_rate_pool_address:
                type:
                  - string
                  - "null"
              sol_conversion_status:
                $ref: "#/components/schemas/TokenOhlcvConversionStatus"
              sol_usd_bucket:
                type:
                  - string
                  - "null"
                format: date-time
              sol_usd_pool_address:
                type:
                  - string
                  - "null"
              trade_count:
                type: integer
                format: int64
                description: Trades in the selected source pool only.
              usd_conversion_status:
                $ref: "#/components/schemas/TokenOhlcvConversionStatus"
              volume_quote:
                type: string
                format: decimal
                description: Quote-token volume in the selected source pool only.
              volume_tokens:
                type: string
                format: decimal
                description: Base-token volume in the selected source pool only.
