  /wallets/{wallet}/transactions/{signature}/compressed-nft-actions:
    get:
      tags:
        - Wallets
      summary: Inspect a wallet's compressed NFT ownership actions in a transaction
      description: Pages DMND's retained Bubblegum ownership actions in ascending execution order, including NFT-only sponsored burns and self transfers once. Uses the latest retained signature coordinate and rejects independent newer, failed or contradictory transaction observations. One repeatable-read snapshot includes both correction generations, exact action cutoffs, original mint inputs, retained metadata updates and source-bound documents. Cursors bind wallet, signature, both correction generations and exact slot/index/time. Coverage is independently partial; an empty page does not establish that no NFT action happened. Metadata-only updates are not ownership actions, transfers do not infer sales or prices, and observations do not certify current metadata, final-chain inclusion or a Merkle proof. Reads indexed DMND data only; no upstream RPC or DAS call.
      operationId: getWalletTransactionCompressedNftActions
      parameters:
        - name: wallet
          in: path
          description: Wallet (base-58).
          required: true
          schema:
