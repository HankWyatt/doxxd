      summary: List pools for a token
      description: |-
        The pools a token trades in, on every venue and against every quote asset, with the same statistics as `GET /pools`. By default the pools whose base is the token (`role=base`); `role=quote` lists the pools quoted in it instead, the same rows as `GET /pools?quote_mint=`, and `role=any` both. `is_price_pool` marks the pool the token's price is read off.

        Ranked by `sort_by`, `liquidity` unless named: `liquidity_quote`, largest first, pools whose reserves are not known yet last. Volumes and liquidity are in each pool's own quote asset (`quote_mint`), in whole decimal-adjusted units, so a ranking over pools of two quotes compares raw amounts; `liquidity_sol` and `liquidity_usd` put them in one unit. As in `GET /pools`, `sort_by=liquidity` leaves out pools whose reserves were read more than 24 hours ago and that have not traded in 24 hours; every other order lists them.

