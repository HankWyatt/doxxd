        slot:
          type: integer
          format: int64
        transaction_index:
          type: integer
          format: int32
        wallets:
          type: array
          items:
            type: string
          description: |-
            Every owner other than the deployer that received tokens in it
            (base-58).
    LifecycleMilestone:
      type: string
      enum:
        - created
        - completed
        - migrated
    LiquidityAction:
      allOf:
        - $ref: "#/components/schemas/LiquidityActionDetails"
