        actor:
          type:
            - string
            - "null"
        actor_basis:
          type:
            - string
            - "null"
        beneficiary:
          type:
            - string
            - "null"
          description: Present only with qualified action-time ownership evidence.
        beneficiary_basis:
          type:
            - string
            - "null"
        block_time:
          type: string
          format: date-time
        event_id:
          type: string
        instruction_index:
          type: integer
          format: int32
          description: The same flattened-caller/leg encoding used by DMND trades.
        legs:
          type: array
          items:
            $ref: "#/components/schemas/LiquidityActionLeg"
        lp:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/LiquidityLpChange"
        pool_address:
          type: string
        position_accounts:
          type: array
          items:
            type: string
          description: |-
            Explicit source position membership when no measured unit delta is recorded.
            This does not establish units, holdings, present ownership or valuation.
            Omitted on older observations, preserving their selected JSON/hash.
        position_changes:
          type: array
          items:
            $ref: "#/components/schemas/LiquidityPositionChange"
