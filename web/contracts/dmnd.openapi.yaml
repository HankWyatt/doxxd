    WalletMeteoraDammV2Liquidity:
      type: object
      description: |-
        Position liquidity by lock state, as exact u128 decimal strings. Locked and
        vesting liquidity is included in the token amounts and values.
      required:
        - unlocked
        - vested
        - permanent_locked
        - total
      properties:
        permanent_locked:
          type: string
        total:
          type: string
          description: Exact sum of `unlocked`, `vested` and `permanent_locked`.
        unlocked:
          type: string
        vested:
          type: string
          description: |-
            Liquidity locked by any vesting, through external `lock_position`
            Vesting accounts or `lock_inner_position`. It decreases only when
            `refresh_vesting` runs, so part of it may already be releasable.
    WalletMeteoraDammV2Position:
      type: object
      required:
        - position_mint
        - position
        - pool
        - program
        - token_program
        - owner_token_account
        - collect_fee_mode
        - token_a
        - token_b
        - liquidity
        - fee_a_claimable_atoms
        - fee_b_claimable_atoms
        - rewards
        - sqrt_price
        - owner_token_slot
        - position_slot
        - pool_slot
        - snapshot_slot
        - snapshot_block_time
      properties:
        collect_fee_mode:
          type: string
          description: "Pool fee collection mode: `both_token`, `only_b` or `compounding`."
        fee_a_claimable_atoms:
          type: string
          description: |-
            Claimable token A fee atoms at `snapshot_block_time` (pending plus
            accrual, as cp-amm computes it), before any Token-2022 transfer fee.
        fee_b_claimable_atoms:
          type: string
          description: Claimable token B fee atoms on the same basis as `fee_a_claimable_atoms`.
        liquidity:
          $ref: "#/components/schemas/WalletMeteoraDammV2Liquidity"
        owner_token_account:
          type: string
        owner_token_slot:
          type: integer
          format: int64
        pool:
          type: string
        pool_price:
          type:
            - string
            - "null"
          description: |-
            Token A priced in token B, decimal adjusted and rounded down to 30
            places; absent when either token's decimals are unknown.
        pool_slot:
          type: integer
          format: int64
        position:
          type: string
        position_mint:
          type: string
          description: Position NFT mint held by the wallet. It has no price or value of its own.
        position_slot:
          type: integer
          format: int64
        principal_value_usd:
          type:
            - string
            - "null"
          description: Sum of both legs' `value_usd`; absent unless both legs are valued.
        program:
          type: string
        rewards:
          type: array
          items:
            $ref: "#/components/schemas/WalletMeteoraDammV2Reward"
        snapshot_block_time:
          type: string
          format: date-time
          description: |-
            Clock sysvar time from the same read as the position, at
            `position_slot` (not `snapshot_slot`); claimable amounts use it.
        snapshot_slot:
          type: integer
          format: int64
        sqrt_price:
          type: string
          description: Pool square-root price as a raw Q64.64 u128 decimal string.
        token_a:
          $ref: "#/components/schemas/WalletLiquidityLeg"
          description: |-
            Gross atoms the pool would release for the total liquidity at the saved
            pool price, floored like `remove_liquidity` over total liquidity (which
            can exceed per-bucket floors by up to 2 atoms per leg), before any
            Token-2022 transfer fee.
        token_b:
          $ref: "#/components/schemas/WalletLiquidityLeg"
          description: Same basis as `token_a`.
        token_program:
          type: string
          description: Token program of the position NFT account.
    WalletMeteoraDammV2Positions:
      type: object
      required:
        - wallet
        - protocol
        - data
        - has_more
        - coverage
      properties:
        coverage:
          $ref: "#/components/schemas/WalletLiquidityCoverage"
