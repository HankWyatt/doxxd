        amount_tokens:
          type: string
        block_time:
          type: string
          format: date-time
        instruction_index:
          type: integer
          format: int32
        original_conversion:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/PositionConversionReceipt"
