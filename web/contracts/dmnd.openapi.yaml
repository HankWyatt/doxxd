      summary: Get a wallet's PnL
      description: |-
        Lifetime totals over every token attributed to the wallet by indexed trades (from `positions_since` on): realized PnL by average cost, unrealized PnL of its indexed positive owned-account balances at qualified current prices, counts, the win rate (closed positions with a realized gain over closed positions; a closed position sold and holds nothing now) and the best and worst token.

        `window=7d|30d` adds the window's trading, replayed from its trades: volumes, counts, and what its sells realized against each token's lifetime average buy cost. The window starts at the later of 7 (30) days ago and `positions_since`. A window of more than 50,000 trades answers 422 `too_large`, as does a wallet with more than 10,000 positions or 20,000 positive token accounts. Stale marks leave their unrealized PnL unknown; totals sum only known components and unrealized_unknown counts unknown SOL positions. Historical realized PnL retains its original trade-time conversion. Answers 503 `wallet_trades_unavailable` for a window while the wallet trades index is being built, or wallet_holdings_unavailable while the owner holdings index is absent or invalid.
