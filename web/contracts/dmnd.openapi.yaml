        live_slot:
          type:
            - integer
            - "null"
          format: int64
        native_sol_complete_since_slot:
          type: boolean
        native_sol_reason:
          type: string
        native_sol_since_slot:
          type:
            - integer
            - "null"
          format: int64
        reason:
          type: string
        since_slot:
          type:
            - integer
            - "null"
          format: int64
    TransferFeeRate:
      type: object
      description: |-
        One of the older/newer fee schedules held on a Token-2022 mint. The
        current epoch decides which applies; the snapshot does not guess it.
