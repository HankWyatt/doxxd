        - chain_verified
        - scope
        - generation
        - metadata_update_generation
        - metadata_updates
      properties:
        chain_verified:
          type: boolean
          description: Checked instruction/leaf rules; not a Merkle proof or finalized snapshot.
        complete:
          type: boolean
          description: False until source history and live overlap are qualified.
        first_unindexed_slot:
          type:
            - integer
            - "null"
          format: int64
        forward_since_slot:
          type:
            - integer
            - "null"
          format: int64
