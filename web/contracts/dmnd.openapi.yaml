        quote_amount:
          type: string
        quote_mint:
          type: string
        side:
          type: string
        signature:
          type: string
        slot:
          type: integer
          format: int64
        transaction_index:
          type: integer
          format: int32
    LabelsBasis:
      type: string
      description: |-
        What a mint's launch slot was read off, which the `sniper` label is
        measured from.
      enum:
        - launch
        - mint
        - pool
        - first_trade
    LaunchTxEvidence:
