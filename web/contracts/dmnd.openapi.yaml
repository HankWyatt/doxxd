        - allOf:
            - $ref: "#/components/schemas/NativeTokenStats"
            - type: object
              required:
                - kind
              properties:
                kind:
                  type: string
                  enum:
                    - native
    TokenFeesPaid:
      type: object
      description: |-
        What traders paid on a token's trades: chain base and priority fees,
        builder tips, platform fees and the venue's pool fee. Failed transactions
        are not counted.
      required:
        - complete
        - lifetime
        - window_5m
        - window_1h
        - window_6h
        - window_24h
      properties:
        complete:
          type: boolean
          description: |-
            Whether `lifetime` covers every trade: the token's first trade is at or
            after `since`.
        lifetime:
          $ref: "#/components/schemas/FeeBreakdown"
          description: |-
            Every trade with a recorded fee: the token's whole history when
            `complete`.
        since:
          type:
            - string
            - "null"
          format: date-time
          description: |-
            Where complete fee history starts: an earlier trade may have no fee
            recorded. Null until live ingest records its first fees.
        window_1h:
          $ref: "#/components/schemas/FeeBreakdown"
        window_24h:
          $ref: "#/components/schemas/FeeBreakdown"
        window_5m:
          $ref: "#/components/schemas/FeeBreakdown"
          description: |-
            Over the same windows as `volume_5m`, `volume_1h`, `volume_6h` and
            `volume_24h` (`trade_window_snapshot` gives their starts).
        window_6h:
          $ref: "#/components/schemas/FeeBreakdown"
    TokenHolder:
      type: object
      description: One token account holding the mint.
      required:
        - owner
        - token_account
        - amount
        - labels
        - last_changed_slot
      properties:
        amount:
          type: string
          format: decimal
          description: Raw atoms.
        avg_buy_market_cap_usd:
          type:
            - string
            - "null"
          format: decimal
          description: "`avg_buy_price_usd` times the current supply."
        avg_buy_price_sol:
          type:
            - string
            - "null"
          format: decimal
          description: SOL per whole token, averaged over the buys.
        avg_buy_price_usd:
          type:
            - string
            - "null"
          format: decimal
        avg_sell_price_sol:
          type:
            - string
            - "null"
          format: decimal
        avg_sell_price_usd:
          type:
            - string
            - "null"
          format: decimal
        bought:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/HolderTradeTotals"
              description: |-
                The owner's buys of the mint. This and the fields below come from
                the owner's attributed trades at or after the page's
                `positions_since` only; null when it has none there (it received the
                token by transfer, or traded only before `positions_since`).
        first_buy_at:
          type:
            - string
            - "null"
          format: date-time
        first_buy_slot:
          type:
            - integer
            - "null"
          format: int64
        label_evidence:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/HolderLabelEvidence"
              description: |-
                Why `dev`, `sniper`, `bundler` or `insider` applies; null when none
                does.
        labels:
          type: array
          items:
            $ref: "#/components/schemas/HolderLabel"
          description: What the owner is known to be. Empty for an ordinary wallet.
        last_active_at:
          type:
            - string
            - "null"
          format: date-time
          description: The owner's newest trade of any token.
        last_changed_slot:
          type: integer
          format: int64
          description: The slot that last changed this account.
        owner:
          type: string
          description: "The account's owner (base-58): the holder."
        percent_of_supply:
          type:
            - string
            - "null"
          format: decimal
          description: |-
            Share of the observed mint issued `supply`, in percent (0 to 100).
            Absent when the denominator is unknown or zero, or the account exceeds
            that observation. The supply can be older than the account balance.
        pnl_percent:
          type:
            - string
            - "null"
          format: decimal
          description: "`total_pnl_sol` over the SOL cost of the tokens it counts, in percent."
        pool_address:
          type:
            - string
            - "null"
          description: The pool whose vault this is, when DMND indexes it.
        realized_pnl_sol:
          type:
            - string
            - "null"
          format: decimal
          description: |-
            Average cost over the lifetime sums: proceeds of the tokens sold that
            were bought, less their average buy cost. Tokens sold past what was
            bought came by transfer and count nothing.
        realized_pnl_usd:
          type:
            - string
            - "null"
          format: decimal
        sol_balance:
          type:
            - string
            - "null"
          format: decimal
          description: |-
            The owner's SOL, as of `sol_balance_slot`: its lamports after the
            newest trade DMND saw live where this owner paid the transaction fee.
            Null when only sponsored or old stored trades are known, or when this
            owner has never been observed as a trade's fee payer.
        sol_balance_slot:
          type:
            - integer
            - "null"
          format: int64
        sold:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/HolderTradeTotals"
        token_account:
          type: string
          description: |-
            The token account (base-58). An owner with two accounts for the mint
            appears twice.
        total_pnl_sol:
          type:
            - string
            - "null"
          format: decimal
        total_pnl_usd:
          type:
            - string
            - "null"
          format: decimal
        transferred_in:
          type:
            - string
            - "null"
          format: decimal
          description: |-
            Whole tokens held beyond what was bought less sold: received by
            transfer, with no cost and no result. Read it against the page's
            `positions_since`: tokens bought before it count here too, and a
            sale of them after it realizes nothing.
        ui_amount:
          type:
            - string
            - "null"
          format: decimal
          description: "`amount` in whole tokens. Absent when the mint's decimals are unknown."
        unpriced_trades:
          type:
            - integer
            - "null"
          format: int32
          description: |-
            Trades missing a SOL or a USD value (no rate at their time). Their
            amounts count in `bought` and `sold`; averages and PnL in each
            currency read only the trades valued in it. 0 when every trade was
            valued in both.
        unrealized_pnl_sol:
          type:
            - string
            - "null"
          format: decimal
          description: |-
            The held tokens that were bought, at the current price less their
            average buy price. Null without a decimals or a price.
        unrealized_pnl_usd:
          type:
            - string
            - "null"
          format: decimal
        value_sol:
          type:
            - string
            - "null"
          format: decimal
          description: |-
            `ui_amount` at the token's `last_trade_price_sol`. Absent when the
            token has no price.
        value_usd:
          type:
            - string
            - "null"
          format: decimal
          description: "`value_sol` at the current SOL price in USD."
    TokenHolderStatsBatch:
      type: object
      description: Complete recovery snapshot for the holder statistics stream.
      required:
