      required:
        - complete
        - capture_fresh
        - reason
        - source
        - generation
      properties:
        capture_fresh:
          type: boolean
          description: |-
            Recent admitted capture with matching generation and no retained source gap.
            Does not certify current metadata or historical completeness.
        complete:
          type: boolean
          description: Always false until historical source and every metadata effect are qualified.
        first_unindexed_slot:
          type:
            - integer
            - "null"
          format: int64
        forward_since_slot:
          type:
            - integer
            - "null"
          format: int64
        generation:
          type: integer
          format: int64
        live_slot:
          type:
            - integer
            - "null"
          format: int64
        live_updated_at:
          type:
            - string
            - "null"
          format: date-time
        reason:
          type: string
        source:
          type: string
    WalletCompressedNftMetadataUpdateObservation:
      type: object
      required:
        - scope
        - current_state_verified
        - name
        - symbol
        - uri
        - seller_fee_basis_points_input
        - royalty_input_mode
        - primary_sale_happened
        - is_mutable
        - creators
        - owner_at_update
        - tree
        - nonce
        - version
        - at
        - slot
        - transaction_index
        - instruction_ordinal
        - signature
        - data_hash
        - creator_hash
        - leaf_hash
      properties:
        at:
          type: string
          format: date-time
        collection:
          type:
            - string
            - "null"
