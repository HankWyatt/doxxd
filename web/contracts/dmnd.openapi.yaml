            its `position` and `pool` become null once a second bundled position opens.
        protocol:
          type: string
          description: "`meteora_damm_v2`, `orca_whirlpools` or `raydium_clmm`."
    WalletChainCompressedNft:
      type: object
      description: |-
        Latest indexed Bubblegum owner event for an asset. Optional metadata is
        unknown until separately observed; it is never inferred from an asset ID.
      required:
        - asset
        - owner
        - tree
        - nonce
        - version
        - updated_slot
        - transaction_index
        - instruction_ordinal
        - signature
      properties:
        asset:
          type: string
        collection:
          type:
            - string
            - "null"
        image:
          type:
            - string
            - "null"
        instruction_ordinal:
          type: integer
          format: int32
        metadata_update_observation:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/WalletCompressedNftMetadataUpdateObservation"
              description: Latest retained update observation. Its presence does not prove freshness.
        mint_metadata_input:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/WalletCompressedNftMintMetadataInput"
              description: Original instruction inputs. Not current metadata or verification.
        name:
          type:
            - string
            - "null"
        nonce:
          type: string
          description: Exact unsigned leaf nonce in decimal, safe for JavaScript clients.
        owner:
          type: string
        signature:
          type: string
        transaction_index:
          type: integer
          format: int32
        tree:
          type: string
        updated_slot:
          type: integer
          format: int64
        uri:
          type:
            - string
            - "null"
        version:
          type: integer
          format: int32
    WalletChainCompressedNfts:
      type: object
      required:
        - wallet
        - data
        - has_more
        - coverage
      properties:
        coverage:
          $ref: "#/components/schemas/WalletChainCompressedNftsCoverage"
        cursor:
          type:
            - string
            - "null"
        data:
          type: array
          items:
            $ref: "#/components/schemas/WalletChainCompressedNft"
        has_more:
          type: boolean
        wallet:
          type: string
    WalletChainCompressedNftsCoverage:
      type: object
      required:
        - complete
        - fresh
        - reason
        - source
        - chain_verified
        - scope
        - total_assets
        - generation
        - metadata_update_generation
        - metadata_updates
      properties:
        chain_verified:
          type: boolean
          description: |-
            Indexed owner events were checked against Bubblegum leaf/call rules.
