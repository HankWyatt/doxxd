      summary: Read recorded pool liquidity additions and removals
      description: Bare paginated source ledger, separate from swaps, prices and balance/PnL accounting. Exact source token-leg and LP mint/burn atom strings come from admitted scoped movements, not instruction limits or reserve differences. Source models cover legacy Raydium AMM v4, Raydium CPMM initial funding/deposit/withdraw and legacy Orca Whirlpool increase/decrease, pinned DLMM legacy-token strategy-add/range-remove operations, and pinned Raydium CLMM open-position/increase/decrease operations with exact base account layouts and scoped SPL or Token2022 movements. CLMM bitmap/hook/reward account variants and fee/reward-bearing removals remain explicit gaps; zero token legs require event evidence and pinned zero-transfer behavior. A source model is not deployment, admission or historical coverage proof. DLMM position_accounts establish membership without a measured share delta or current owner; other selectors and Token2022/hooks remain unqualified for DLMM. Concentrated position units stay separate from token atoms and fungible LP receipts. Other layouts, other pool-initialization variants, fees and lifetime history remain unqualified. Actor is the instruction authority and may be a runtime-authorized CPI/PDA; nullable beneficiary requires action-time LP or position-token account ownership evidence. Transaction fee and payer describe the whole transaction, never an allocation per action. Page membership freezes at its own safe ledger revision; continue with identical scope and filters. A lagging replica refuses rather than returning an empty page. Range narrowing may be required by bounded source scans. Coverage guard state is current; observed slot bounds describe only this page, never a continuous span. Unknown unresolved counts are null. Historical completeness remains false, including empty responses. Reads never perform RPC, scans of wallets, enqueue or execute repair. No quote normalization, USD estimate or executable depth is implied.
