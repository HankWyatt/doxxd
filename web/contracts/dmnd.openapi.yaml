    Page_PoolStats:
      type: object
      description: |-
        A paginated response envelope.

        Cursors are opaque, server-issued, and forward-only. Omit `cursor` on the
        first request; pass the `cursor` from each response into the next request's
        `cursor` query parameter to fetch the following page. When `has_more` is
        `false`, the current page is the last one.
      required:
        - data
        - has_more
      properties:
        cursor:
          type:
            - string
            - "null"
          description: Cursor to pass into the next request's `cursor` query parameter. `null` on the last page.
        data:
          type: array
          items:
            type: object
            required:
              - pool_address
              - mint
              - quote_mint
              - exchange
              - pool_type
              - volume_5m
              - trades_5m
              - buys_5m
              - sells_5m
              - makers_5m
              - volume_1h
              - trades_1h
              - buys_1h
              - sells_1h
              - makers_1h
              - volume_6h
              - trades_6h
              - buys_6h
              - sells_6h
              - makers_6h
              - volume_24h
              - trades_24h
              - buys_24h
              - sells_24h
              - makers_24h
            properties:
              base_decimals:
                type:
                  - integer
                  - "null"
                format: int32
                description: Base token decimals, when recorded.
              base_reserve:
                type:
                  - string
                  - "null"
                format: decimal
                description: |-
                  Whole base tokens the pool held once the transaction at
                  `reserves_slot` settled: its vault's balance (a bonding curve's
                  includes supply it has not sold).
              buys_1h:
                type: integer
                format: int64
              buys_24h:
                type: integer
                format: int64
              buys_5m:
                type: integer
                format: int64
              buys_6h:
                type: integer
                format: int64
              exchange:
                type: string
              first_trade_at:
                type:
                  - string
                  - "null"
                format: date-time
              last_trade_price:
                type:
                  - string
                  - "null"
                format: decimal
                description: |-
                  Price of the pool's last trade, in whole `quote_mint` tokens per whole
                  base token, at `latest_trade_at`. Absent until the pool has traded.
              last_trade_price_sol:
                type:
                  - string
                  - "null"
                format: decimal
                description: |-
                  `last_trade_price` when `quote_mint` is wrapped SOL, in SOL per whole
                  base token; absent for a pool quoted in anything else.
              latest_trade_at:
                type:
                  - string
                  - "null"
                format: date-time
              liquidity_quote:
                type:
                  - string
                  - "null"
                format: decimal
                description: |-
                  The pool's liquidity in whole `quote_mint` tokens: `quote_reserve` plus
                  `base_reserve` at `last_trade_price`, the base side counted for no
                  more than `quote_reserve`, the side a holder can exit into. A balanced
                  pool reads both sides whole; a single-sided or mispriced one reads at
                  most twice its quote. A bonding curve reads `quote_reserve` alone,
                  since no seller can take out its unsold supply. Absent until the
                  pool's reserves are known.
              liquidity_sol:
                type:
                  - string
                  - "null"
                format: decimal
                description: |-
                  `liquidity_quote` in SOL, at the quote asset's SOL price. Absent when
                  the quote has none.
              liquidity_usd:
                type:
                  - number
                  - "null"
                format: double
                description: |-
                  `liquidity_sol` in US dollars, at a qualified current SOL/USD source.
                  Absent when either conversion is unavailable or stale.
              makers_1h:
                type: integer
                format: int64
              makers_24h:
                type: integer
                format: int64
              makers_5m:
                type: integer
                format: int64
              makers_6h:
                type: integer
                format: int64
              mint:
                type: string
                description: Base token mint (base-58).
              pool_address:
                type: string
              pool_type:
                $ref: "#/components/schemas/PoolType"
                description: Pool kind.
              price_change_1h:
                type:
                  - string
                  - "null"
                format: decimal
                description: |-
                  Percent change of `last_trade_price` over the window, measured in the
                  pool's own quote asset; absent when either end is unpriced.
              price_change_24h:
                type:
                  - string
                  - "null"
                format: decimal
              price_change_6h:
                type:
                  - string
                  - "null"
                format: decimal
              quote_decimals:
                type:
                  - integer
                  - "null"
                format: int32
                description: Quote token decimals, when recorded.
              quote_mint:
                type: string
                description: |-
                  Quote token mint (base-58): the asset every price and volume in this row
                  is denominated in. Any token, not only wrapped SOL
                  (`So11111111111111111111111111111111111111112`); a USDC pool's prices
                  are in USDC.
              quote_reserve:
                type:
                  - string
                  - "null"
                format: decimal
                description: |-
                  Whole `quote_mint` tokens the pool held then. A pump.fun curve's is the
                  SOL it holds past its rent.
              reserves_at:
                type:
                  - string
                  - "null"
                format: date-time
                description: Block time of `reserves_slot`.
              reserves_slot:
                type:
                  - integer
                  - "null"
                format: int64
                description: |-
                  Slot of the newest swap or creation the reserves were read off. They
                  move with swaps only, so a deposit or withdrawal shows at the next
                  swap.
              sells_1h:
                type: integer
                format: int64
              sells_24h:
                type: integer
                format: int64
              sells_5m:
                type: integer
                format: int64
              sells_6h:
                type: integer
                format: int64
              trades_1h:
                type: integer
                format: int64
              trades_24h:
                type: integer
                format: int64
              trades_5m:
                type: integer
                format: int64
              trades_6h:
                type: integer
                format: int64
              volume_1h:
                type: string
                format: decimal
                description: Quote volume over the last hour, in whole `quote_mint` tokens.
              volume_24h:
                type: string
                format: decimal
                description: Quote volume over the last 24 hours, in whole `quote_mint` tokens.
              volume_5m:
                type: string
                format: decimal
                description: Quote volume over the last 5 minutes, in whole `quote_mint` tokens.
              volume_6h:
                type: string
                format: decimal
                description: Quote volume over the last 6 hours, in whole `quote_mint` tokens.
          description: The current page's items.
        has_more:
          type: boolean
          description: "`true` if at least one more page exists beyond the current one."
    Page_TokenPool:
      type: object
      description: |-
        A paginated response envelope.

        Cursors are opaque, server-issued, and forward-only. Omit `cursor` on the
        first request; pass the `cursor` from each response into the next request's
        `cursor` query parameter to fetch the following page. When `has_more` is
        `false`, the current page is the last one.
      required:
        - data
        - has_more
      properties:
        cursor:
          type:
            - string
            - "null"
          description: Cursor to pass into the next request's `cursor` query parameter. `null` on the last page.
        data:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/PoolStats"
              - type: object
                required:
                  - is_price_pool
                properties:
                  is_price_pool:
                    type: boolean
                    description: |-
                      Whether this is the token's `price_pool_address`, the pool its
                      `last_trade_price_sol` is read off. At most one pool of a token is.
            description: |-
              A pool in `GET /tokens/{mint}/pools`: the pool's statistics, and whether
              the token's price is read off it.
          description: The current page's items.
        has_more:
          type: boolean
          description: "`true` if at least one more page exists beyond the current one."
    Page_TokenStats:
      type: object
      description: |-
        A paginated response envelope.

        Cursors are opaque, server-issued, and forward-only. Omit `cursor` on the
        first request; pass the `cursor` from each response into the next request's
        `cursor` query parameter to fetch the following page. When `has_more` is
        `false`, the current page is the last one.
      required:
        - data
        - has_more
      properties:
        cursor:
          type:
            - string
            - "null"
          description: Cursor to pass into the next request's `cursor` query parameter. `null` on the last page.
        data:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/TokenOriginFields"
              - type: object
                required:
                  - mint
                  - pool_count
                  - unpriced_pools
                  - volume_5m
                  - buy_volume_5m
                  - sell_volume_5m
                  - trades_5m
                  - buys_5m
                  - sells_5m
                  - makers_5m
                  - volume_1h
                  - buy_volume_1h
                  - sell_volume_1h
                  - trades_1h
                  - buys_1h
                  - sells_1h
                  - makers_1h
                  - volume_6h
                  - buy_volume_6h
                  - sell_volume_6h
                  - trades_6h
                  - buys_6h
                  - sells_6h
                  - makers_6h
                  - volume_24h
                  - buy_volume_24h
                  - sell_volume_24h
                  - trades_24h
                  - buys_24h
                  - sells_24h
                  - makers_24h
                  - holders_complete
                properties:
                  account_count:
                    type:
                      - integer
                      - "null"
                    format: int64
                    description: |-
                      Token accounts with a positive balance, kept exact by every balance
                      write. Null until DMND has counted the mint once since tracking it
                      (immediately for a mint initialized since).
                  account_count_as_of_slot:
                    type:
                      - integer
                      - "null"
                    format: int64
                    description: The newest slot `account_count` reflects.
                  bundlers_pct:
                    type:
                      - string
                      - "null"
                    format: decimal
                  buy_volume_1h:
                    type: string
                    format: decimal
                    description: SOL volume of base-token buys, converted and windowed as `volume_1h`.
                  buy_volume_24h:
                    type: string
                    format: decimal
                    description: SOL volume of base-token buys, converted and windowed as `volume_24h`.
                  buy_volume_5m:
                    type: string
                    format: decimal
                    description: SOL volume of base-token buys, converted and windowed as `volume_5m`.
                  buy_volume_6h:
                    type: string
                    format: decimal
                    description: SOL volume of base-token buys, converted and windowed as `volume_6h`.
                  buys_1h:
                    type: integer
                    format: int64
                  buys_24h:
                    type: integer
                    format: int64
                  buys_5m:
                    type: integer
                    format: int64
                  buys_6h:
                    type: integer
                    format: int64
                  concentration_at:
                    type:
                      - string
                      - "null"
                    format: date-time
                    description: Recount read time; it does not certify the mint supply's freshness.
                  concentration_basis:
                    oneOf:
                      - type: "null"
                      - $ref: "#/components/schemas/HolderPercentageBasis"
                        description: The independently stored concentration snapshot's denominator basis.
                  concentration_complete:
                    type:
                      - boolean
                      - "null"
                  concentration_slot:
                    type:
                      - integer
                      - "null"
                    format: int64
                    description: |-
                      Committed index watermark checked before reading the recount; not the
                      mint-account RPC context slot.
                  concentration_supply:
                    type:
                      - string
                      - "null"
                    format: decimal
                    description: Observed mint issued supply used by all concentration percentages.
                  count_basis:
                    oneOf:
                      - type: "null"
                      - $ref: "#/components/schemas/CountBasis"
                        description: |-
                          What `holder_count` counts: `owners` or `accounts`. Null with
                          `holder_count`. The basis can change between two reads with no
                          holder change at all (an owner count goes stale, or a fresh one
                          lands), and the number moves with it, usually by the few owners that
                          hold more than one account: compare readings only on the same
                          `count_basis`.
                  created_at:
                    type:
                      - string
                      - "null"
                    format: date-time
                  decimals:
                    type:
                      - integer
                      - "null"
                    format: int32
                  dev_pct:
                    type:
                      - string
                      - "null"
                    format: decimal
                    description: |-
                      Share of supply the deployer holds (the `dev` of
                      `GET /tokens/{mint}/holders`), in percent. Absent when the supply or
                      the dev is unknown.
                  fees_paid:
                    oneOf:
                      - type: "null"
                      - $ref: "#/components/schemas/TokenFeesPaid"
                        description: |-
                          Fees paid by component, over the token's lifetime and each window.
                          Every REST and streaming response carries it, from the fresh read;
                          null only on a row that missed that read, such as a message from a
                          producer older than this field.
                  fees_paid_1h:
                    type: string
                    format: decimal
                    description: The same over the last hour.
                  fees_paid_24h:
                    type: string
                    format: decimal
                    description: The same over the last 24 hours. `GET /tokens` sorts by it.
                  fees_paid_5m:
                    type: string
                    format: decimal
                    description: |-
                      Fees traders paid on this token's trades over the last 5 minutes, in
                      SOL: `fees_paid.window_5m.total_sol`. `GET /tokens` ranks on the
                      windows cron's copy, refreshed every 30 seconds; responses carry the
                      fresh value.
                  fees_paid_6h:
                    type: string
                    format: decimal
                    description: The same over the last 6 hours.
                  first_trade_at:
                    type:
                      - string
                      - "null"
                    format: date-time
                  holder_change_1h:
                    type:
                      - integer
                      - "null"
                    format: int64
                    description: |-
                      Distinct owners at the last owner count less those an hour before it
                      (the last count taken at or before then; see
                      `GET /tokens/{mint}/holders/history`). Null until the history reaches
                      that far back, while the counts are null, and once `holder_change_at`
                      is more than an hour old. Always owner-based, whatever
                      `count_basis` says: it is not `holder_count`'s change when that
                      serves accounts.
                  holder_change_24h:
                    type:
                      - integer
                      - "null"
                    format: int64
                    description: The same over 24 hours, owner-based too.
                  holder_change_at:
                    type:
                      - string
                      - "null"
                    format: date-time
                    description: |-
                      When the count that computed `holder_change_1h` and
                      `holder_change_24h` ran. A mint is recounted only when its balances
                      change, so each change is null once this is older than its window.
                  holder_count:
                    type:
                      - integer
                      - "null"
                    format: int64
                    description: |-
                      Holders with a positive balance, counted as `count_basis` says:
                      distinct owners while the stored recount matches the tracked source
                      generation/revision with no pending change, else token accounts
                      (`account_count`) once seeded. A lower bound while `holders_complete` is false;
                      null when neither is known yet. A poller can see it move when
                      `count_basis` flips, with no holder change behind it. See
                      `GET /tokens/{mint}/holders`.
                  holder_count_excluding_lp:
                    type:
                      - integer
                      - "null"
                    format: int64
                    description: |-
                      `holder_count` less pool vaults, shared vault authorities and burn
                      addresses, on the same basis.
                  holders_complete:
                    type: boolean
                    description: |-
                      Whether DMND holds every account of the mint. See
                      `GET /tokens/{mint}/holders`.
                  image_url:
                    type:
                      - string
                      - "null"
                  insiders_pct:
                    type:
                      - string
                      - "null"
                    format: decimal
                  last_trade_price_sol:
                    type:
                      - string
                      - "null"
                    format: decimal
                    description: |-
                      Price of the last trade in `price_pool_address`, in SOL per whole token:
                      converted at the quote asset's SOL price when the pool is not quoted in
                      SOL. Absent when the token has no pricing pool or its quote has no SOL
                      price.
                  last_trade_price_usd:
                    type:
                      - number
                      - "null"
                    format: double
                    description: "`last_trade_price_sol` in US dollars, at `sol_usd`."
                  latest_trade_at:
                    type:
                      - string
                      - "null"
                    format: date-time
                  liquidity_sol:
                    type:
                      - string
                      - "null"
                    format: decimal
                    description: |-
                      Liquidity of the token's pools summed in SOL, each converted at its
                      quote asset's SOL price, over the pools whose quote has one and whose
                      liquidity is known. A pool whose reserves were read more than 24 hours
                      ago and that has not traded in 24 hours is left out. Absent when no
                      pool counts.
                  liquidity_usd:
                    type:
                      - number
                      - "null"
                    format: double
                    description: "`liquidity_sol` in US dollars, at `sol_usd`."
                  makers_1h:
                    type: integer
                    format: int64
                  makers_24h:
                    type: integer
                    format: int64
                  makers_5m:
                    type: integer
                    format: int64
                  makers_6h:
                    type: integer
                    format: int64
                  market_cap_sol:
                    type:
                      - string
                      - "null"
                    format: decimal
                    description: |-
                      `last_trade_price_sol` times issued mint supply, scaled by mint decimals.
                      This is not an independently measured circulating supply. Absent when either is
                      unknown: no price, or a supply not yet read off the mint.
                  market_cap_usd:
                    type:
                      - number
                      - "null"
                    format: double
                    description: "`market_cap_sol` in US dollars, at `sol_usd`."
                  mint:
                    type: string
                  name:
                    type:
                      - string
                      - "null"
                  pool_count:
                    type: integer
                    format: int64
                    description: |-
                      Base-side pools with eligible SOL quote conversion: the population
                      every volume and trade count below sums over, including inactive pools.
                      This excludes, rather than contains, `unpriced_pools`.
                  price_change_1h:
                    type:
                      - string
                      - "null"
                    format: decimal
                  price_change_24h:
                    type:
                      - string
                      - "null"
                    format: decimal
                  price_change_5m:
                    type:
                      - string
                      - "null"
                    format: decimal
                    description: |-
                      Percent change in the reference pool's quote from its first available
                      one-minute candle within the trailing five minutes. Null without a
                      positive open; an unchanged measured price is zero.
                  price_change_6h:
                    type:
                      - string
                      - "null"
                    format: decimal
                  price_pool_address:
                    type:
                      - string
                      - "null"
                    description: |-
                      The pool `last_trade_price_sol` is taken from: among the token's pools
                      whose quote asset has a SOL price, the one with the most 24h volume in
                      SOL. Another pool takes over only once it has 20% more.
                  price_quote_mint:
                    type:
                      - string
                      - "null"
                    description: Quote asset of `price_pool_address`. `price_change_*` are measured in it.
                  sell_volume_1h:
                    type: string
                    format: decimal
                    description: SOL volume of base-token sells, converted and windowed as `volume_1h`.
                  sell_volume_24h:
                    type: string
                    format: decimal
                    description: SOL volume of base-token sells, converted and windowed as `volume_24h`.
                  sell_volume_5m:
                    type: string
                    format: decimal
                    description: SOL volume of base-token sells, converted and windowed as `volume_5m`.
                  sell_volume_6h:
                    type: string
                    format: decimal
                    description: SOL volume of base-token sells, converted and windowed as `volume_6h`.
                  sells_1h:
                    type: integer
                    format: int64
                  sells_24h:
                    type: integer
                    format: int64
                  sells_5m:
                    type: integer
                    format: int64
                  sells_6h:
                    type: integer
                    format: int64
                  snipers_pct:
                    type:
                      - string
                      - "null"
                    format: decimal
                    description: |-
                      Share of supply held by owners labelled `sniper`, `bundler` and
                      `insider` on the holders page, in percent. Each is absent when the
                      supply is unknown, or when DMND did not see the launch (the holders
                      page's `labels_basis` is not `launch` or `mint`), or a holder recount
                      has not captured completed launch labeling. A measured zero means no
                      observed positive balance carries the label, qualified by coverage.
                  sol_usd:
                    type:
                      - number
                      - "null"
                    format: double
                    description: |-
                      The SOL/USD price the `_usd` fields use, as `GET /price/sol` serves it.
                      Multiply any `_sol` value or volume by it for US dollars. Absent when no
                      SOL/USD price is known.
                  symbol:
                    type:
                      - string
                      - "null"
                  top100_pct:
                    type:
                      - string
                      - "null"
                    format: decimal
                  top10_pct:
                    type:
                      - string
                      - "null"
                    format: decimal
                    description: |-
                      Share of supply held by the ten largest accounts outside pool vaults
                      and burn addresses, in percent, using `concentration_supply` from the
                      independent recount. Unknown, zero or contradictory supply yields null.
                      Partial observed shares have `concentration_complete: false`.
                  top50_pct:
                    type:
                      - string
                      - "null"
                    format: decimal
                    description: The same for the 50 and the 100 largest accounts.
                  total_supply:
                    type:
                      - string
                      - "null"
                    format: decimal
                  trade_window_snapshot:
                    oneOf:
                      - type: "null"
                      - $ref: "#/components/schemas/TokenTradeWindowSnapshot"
                        description: |-
                          Present on fresh single-token, watchlist and streaming reads. Null on
                          cached market rankings. Describes volume/count windows only; makers,
                          price changes and other projections have their own refresh schedules.
                  trades_1h:
                    type: integer
                    format: int64
                  trades_24h:
                    type: integer
                    format: int64
                  trades_5m:
                    type: integer
                    format: int64
                  trades_6h:
                    type: integer
                    format: int64
                  unpriced_pools:
                    type: integer
                    format: int64
                    description: |-
                      Base-side pools left out of volumes and trade counts because their quote
                      asset has no eligible SOL conversion. Separate from `pool_count`, not
                      its subset; neither pool counter is restricted to a trade window.
                  unverified_metadata_uri:
                    type:
                      - string
                      - "null"
                    description: Metadata URI as the token's creator wrote it. Resolve it at your own risk.
                  volume_1h:
                    type: string
                    format: decimal
                    description: SOL volume in the expanded 1H candle window, converted as `volume_5m`.
                  volume_24h:
                    type: string
                    format: decimal
                    description: SOL volume in the expanded 24H candle window, converted as `volume_5m`.
                  volume_5m:
                    type: string
                    format: decimal
                    description: |-
                      Decimal-adjusted SOL volume in the expanded 5M candle window, over
                      base-side pools with eligible quote conversion. Each pool's quote volume
                      is converted at the snapshot rate, not each trade's historical rate.
                  volume_6h:
                    type: string
                    format: decimal
                    description: SOL volume in the expanded 6H candle window, converted as `volume_5m`.
          description: The current page's items.
        has_more:
          type: boolean
          description: "`true` if at least one more page exists beyond the current one."
    Page_Trade:
      type: object
      description: |-
        A paginated response envelope.

        Cursors are opaque, server-issued, and forward-only. Omit `cursor` on the
        first request; pass the `cursor` from each response into the next request's
        `cursor` query parameter to fetch the following page. When `has_more` is
        `false`, the current page is the last one.
      required:
        - data
        - has_more
      properties:
        cursor:
          type:
            - string
            - "null"
          description: Cursor to pass into the next request's `cursor` query parameter. `null` on the last page.
        data:
          type: array
          items:
            type: object
            required:
              - signature
              - transaction_index
              - instruction_index
              - pool_address
              - mint
              - quote_mint
              - exchange
              - side
              - amount_tokens
              - quote_amount
              - slot
              - block_time
            properties:
              amount_tokens:
                type: string
                format: decimal
                description: Base-token amount, in display units.
              block_time:
                type: string
                format: date-time
                description: Block time (UTC).
              commitment:
                $ref: "#/components/schemas/Commitment"
                description: |-
                  `confirmed` everywhere but on `trade_processed`. Absent from older
                  payloads, which read as `confirmed`.
              exchange:
                type: string
                description: |-
                  Venue the trade executed against, lower snake_case. The coverage page
                  lists the current set.
              execution_price:
                type:
                  - string
                  - "null"
                format: decimal
                description: |-
                  What this swap executed at: `quote_amount / amount_tokens`, in
                  `quote_mint` units per whole base token. Absent when the swap moved no
                  base tokens.
              instruction_index:
                type: integer
                format: int32
                description: Index of the swap instruction within the transaction.
              mint:
                type: string
                description: Base token mint (base-58).
              pool_address:
                type: string
                description: Pool address (base-58).
              post_swap_spot:
                oneOf:
                  - type: "null"
                  - $ref: "#/components/schemas/PostSwapSpot"
                    description: |-
                      Source-qualified post-swap pool price in the same mint orientation.
                      Null means unavailable/unqualified, including older retained trades;
                      execution price is never substituted. Contains no USD/market-cap/FX.
              quote_amount:
                type: string
                format: decimal
                description: Quote-token amount, in display units.
              quote_mint:
                type: string
                description: Quote token mint (base-58).
              side:
                $ref: "#/components/schemas/Side"
                description: "Trade direction: buy or sell."
              signature:
                type: string
                description: Solana transaction signature (base-58).
              slot:
                type: integer
                format: int64
                description: Solana slot the trade landed in.
              transaction_index:
                type: integer
                format: int32
                description: Position of the transaction within its block.
              wallet:
                type:
                  - string
                  - "null"
                description: |-
                  Attributed wallet address (base-58). Some venues verify the trader from
                  token ownership; others still use the transaction fee payer as a proxy.
                  `null` when neither is available.
          description: The current page's items.
        has_more:
          type: boolean
          description: "`true` if at least one more page exists beyond the current one."
    PnlWindow:
      type: string
      description: The window `GET /wallets/{wallet}/pnl` adds to the lifetime totals.
      enum:
        - 7d
        - 30d
    Pool:
      type: object
      required:
        - address
        - mint
        - exchange
        - pool_type
      properties:
        address:
          type: string
          description: Pool address (base-58).
        base_decimals:
          type:
            - integer
            - "null"
          format: int32
          description: Base token decimals.
        created_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the pool was created (UTC).
        exchange:
          type: string
          description: |-
            Venue that hosts the pool, lower snake_case. The coverage page lists the
            current set.
        last_updated_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the pool was last updated (UTC).
        last_updated_slot:
          type:
            - integer
            - "null"
          format: int64
          description: Solana slot of the last update.
        mint:
          type: string
          description: Base token mint (base-58).
        pool_type:
          $ref: "#/components/schemas/PoolType"
          description: Pool kind.
        quote_decimals:
          type:
            - integer
            - "null"
          format: int32
          description: Quote token decimals.
        quote_mint:
          type:
            - string
            - "null"
          description: Quote token mint (base-58).
    PoolCurveEvidence:
      type: object
      description: Exact admitted event evidence. Atom quantities are strings, never floats.
      required:
        - model
        - program
        - pool
        - mint
        - quote_mint
        - virtual_base_atoms
        - virtual_quote_atoms
        - real_base_atoms
        - real_quote_atoms
        - base_decimals
        - quote_decimals
        - quote_amount_gross_atoms
        - quote_amount_net_atoms
        - protocol_fee_atoms
        - creator_fee_atoms
        - slot
        - transaction_index
        - outer_instruction
        - caller_ordinal
        - event_ordinal
        - signature
        - block_time
        - event_timestamp
        - decoder_revision
        - source
        - event_sha256
        - event_base64
      properties:
        base_decimals:
          type: integer
          format: int32
          minimum: 0
        block_time:
          type: string
          format: date-time
        caller_ordinal:
          type: integer
          format: int32
          description: Transaction-wide canonical instruction position, not caller-local index.
        creator_fee_atoms:
          type: string
        decoder_revision:
          type: string
        event_base64:
          type: string
          description: Entire framed event bytes, canonical standard base64;373 bytes in v1.
        event_ordinal:
          type: integer
          format: int32
          description: Transaction-wide canonical position of the self-CPI event instruction.
        event_sha256:
          type: string
          description: SHA256 of the entire framed self-CPI instruction data.
        event_timestamp:
          type: integer
          format: int64
          description: Program-declared Unix seconds, separate from capture/read time.
        mint:
          type: string
        model:
          type: string
        outer_instruction:
          type: integer
          format: int32
        pool:
          type: string
        program:
          type: string
        protocol_fee_atoms:
          type: string
        quote_amount_gross_atoms:
          type: string
        quote_amount_net_atoms:
          type: string
        quote_decimals:
          type: integer
          format: int32
          minimum: 0
        quote_mint:
          type: string
        real_base_atoms:
          type: string
        real_quote_atoms:
          type: string
        signature:
          type: string
        slot:
          type: integer
          format: int64
        source:
          type: string
          description: First path admitting this latest record; not immutable event identity.
        transaction_index:
          type: integer
          format: int32
        virtual_base_atoms:
          type: string
        virtual_quote_atoms:
          type: string
    PoolCurveObservation:
      allOf:
        - $ref: "#/components/schemas/PoolCurveEvidence"
        - type: object
          required:
            - captured_at
          properties:
            captured_at:
              type: string
              format: date-time
    PoolCurveSnapshot:
      type: object
      required:
        - pool
        - supported
        - observed_at
        - current_state_verified
        - historical_complete
        - execution_quote_available
      properties:
        current_state_verified:
          type: boolean
        execution_quote_available:
          type: boolean
        historical_complete:
          type: boolean
        latest_observation:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/PoolCurveObservation"
        observed_at:
          type: string
          format: date-time
          description: Database snapshot read time, not an event freshness clock.
        pool:
          type: string
        program:
          type:
            - string
            - "null"
        supported:
          type: boolean
          description: An admitted observed model, not current-epoch or all-layout coverage.
    PoolLiquidityState:
      type: object
      required:
        - pool
        - status
        - fresh
        - lockers_complete
      properties:
        as_of_slot:
          type:
            - integer
            - "null"
          format: int64
        cpmm_lp_supply:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/CpmmLpSupplyEvidence"
              description: Retained facts may predate a pending/failed refresh. Honor status/fresh.
        error:
          type:
            - string
            - "null"
        fetched_at:
          type:
            - string
            - "null"
          format: date-time
        fresh:
          type: boolean
          description: Only a completed observation younger than five minutes is fresh.
        locked_lp_atoms:
          type:
            - string
            - "null"
          description: "Null: locker custody is not measured by this supply observation."
        lockers_complete:
          type: boolean
          description: Always false until supported locker inventories qualify independently.
        pool:
          type: string
        status:
          $ref: "#/components/schemas/PoolLiquidityStatus"
    PoolLiquidityStatus:
      type: string
      enum:
        - pending
        - done
        - failed
        - unsupported
        - disabled
        - queue_full
    PoolRole:
      type: string
      description: Which of a token's pools `GET /tokens/{mint}/pools` lists.
      enum:
        - base
        - quote
        - any
    PoolSortBy:
      type: string
      enum:
        - volume_5m
        - volume_1h
        - volume_6h
        - volume_24h
        - trades_24h
        - latest_trade_at
        - liquidity
    PoolStats:
      type: object
      required:
        - pool_address
        - mint
        - quote_mint
        - exchange
        - pool_type
        - volume_5m
        - trades_5m
        - buys_5m
        - sells_5m
        - makers_5m
        - volume_1h
        - trades_1h
        - buys_1h
        - sells_1h
        - makers_1h
        - volume_6h
        - trades_6h
        - buys_6h
        - sells_6h
        - makers_6h
        - volume_24h
        - trades_24h
        - buys_24h
        - sells_24h
        - makers_24h
      properties:
        base_decimals:
          type:
            - integer
            - "null"
          format: int32
          description: Base token decimals, when recorded.
        base_reserve:
          type:
            - string
            - "null"
          format: decimal
          description: |-
            Whole base tokens the pool held once the transaction at
            `reserves_slot` settled: its vault's balance (a bonding curve's
            includes supply it has not sold).
        buys_1h:
          type: integer
          format: int64
        buys_24h:
          type: integer
          format: int64
        buys_5m:
          type: integer
          format: int64
        buys_6h:
          type: integer
          format: int64
        exchange:
          type: string
        first_trade_at:
          type:
            - string
            - "null"
          format: date-time
        last_trade_price:
          type:
            - string
            - "null"
          format: decimal
          description: |-
            Price of the pool's last trade, in whole `quote_mint` tokens per whole
            base token, at `latest_trade_at`. Absent until the pool has traded.
        last_trade_price_sol:
          type:
            - string
            - "null"
          format: decimal
          description: |-
            `last_trade_price` when `quote_mint` is wrapped SOL, in SOL per whole
            base token; absent for a pool quoted in anything else.
        latest_trade_at:
          type:
            - string
            - "null"
          format: date-time
        liquidity_quote:
          type:
            - string
            - "null"
          format: decimal
          description: |-
            The pool's liquidity in whole `quote_mint` tokens: `quote_reserve` plus
            `base_reserve` at `last_trade_price`, the base side counted for no
            more than `quote_reserve`, the side a holder can exit into. A balanced
            pool reads both sides whole; a single-sided or mispriced one reads at
            most twice its quote. A bonding curve reads `quote_reserve` alone,
            since no seller can take out its unsold supply. Absent until the
            pool's reserves are known.
        liquidity_sol:
          type:
            - string
            - "null"
          format: decimal
          description: |-
            `liquidity_quote` in SOL, at the quote asset's SOL price. Absent when
            the quote has none.
        liquidity_usd:
          type:
            - number
            - "null"
          format: double
          description: |-
            `liquidity_sol` in US dollars, at a qualified current SOL/USD source.
            Absent when either conversion is unavailable or stale.
        makers_1h:
          type: integer
          format: int64
        makers_24h:
          type: integer
          format: int64
        makers_5m:
          type: integer
          format: int64
        makers_6h:
          type: integer
          format: int64
        mint:
          type: string
          description: Base token mint (base-58).
        pool_address:
          type: string
        pool_type:
          $ref: "#/components/schemas/PoolType"
          description: Pool kind.
        price_change_1h:
          type:
            - string
            - "null"
          format: decimal
          description: |-
            Percent change of `last_trade_price` over the window, measured in the
            pool's own quote asset; absent when either end is unpriced.
        price_change_24h:
          type:
            - string
            - "null"
          format: decimal
        price_change_6h:
          type:
            - string
            - "null"
          format: decimal
        quote_decimals:
          type:
            - integer
            - "null"
          format: int32
          description: Quote token decimals, when recorded.
        quote_mint:
          type: string
          description: |-
            Quote token mint (base-58): the asset every price and volume in this row
            is denominated in. Any token, not only wrapped SOL
            (`So11111111111111111111111111111111111111112`); a USDC pool's prices
            are in USDC.
        quote_reserve:
          type:
            - string
            - "null"
          format: decimal
          description: |-
            Whole `quote_mint` tokens the pool held then. A pump.fun curve's is the
            SOL it holds past its rent.
        reserves_at:
          type:
            - string
            - "null"
          format: date-time
          description: Block time of `reserves_slot`.
        reserves_slot:
          type:
            - integer
            - "null"
          format: int64
          description: |-
            Slot of the newest swap or creation the reserves were read off. They
            move with swaps only, so a deposit or withdrawal shows at the next
            swap.
        sells_1h:
          type: integer
          format: int64
        sells_24h:
          type: integer
          format: int64
        sells_5m:
          type: integer
          format: int64
        sells_6h:
          type: integer
          format: int64
        trades_1h:
          type: integer
          format: int64
        trades_24h:
          type: integer
          format: int64
        trades_5m:
          type: integer
          format: int64
        trades_6h:
          type: integer
          format: int64
        volume_1h:
          type: string
          format: decimal
          description: Quote volume over the last hour, in whole `quote_mint` tokens.
        volume_24h:
          type: string
          format: decimal
          description: Quote volume over the last 24 hours, in whole `quote_mint` tokens.
        volume_5m:
          type: string
          format: decimal
          description: Quote volume over the last 5 minutes, in whole `quote_mint` tokens.
        volume_6h:
          type: string
          format: decimal
          description: Quote volume over the last 6 hours, in whole `quote_mint` tokens.
