        reason:
          type: string
        replay_through_slot:
          type:
            - integer
            - "null"
          format: int64
        scope:
          type: string
        source:
          type: string
    WalletCompressedNftMetadataCoverage:
      type: object
      description: |-
        Independent source evidence for supported metadata update observations.
