        This observation never includes USD, supply, market cap or inferred fees.
      required:
        - source
        - source_program_id
        - source_event_ordinal
        - sqrt_price_x64
        - tick
        - token_0_mint
        - token_1_mint
        - token_0_decimals
        - token_1_decimals
        - base_mint
        - quote_mint
        - price_quote_per_token
      properties:
        base_mint:
          type: string
        price_quote_per_token:
          type: string
          format: decimal
          description: |-
            Post-swap quote units per whole base token, at most 36 significant
            digits. Derived from sqrt state and scales, never execution or fees.
        quote_mint:
          type: string
        source:
          $ref: "#/components/schemas/PostSwapSpotSource"
        source_event_ordinal:
          type: integer
          format: int32
          description: Ordinal of this caller-scoped swap event, not its transaction log offset.
          minimum: 0
        source_program_id:
          type: string
        sqrt_price_x64:
          type: string
          description: Exact source Q64.64 integer. Never a floating-point JSON number.
        tick:
          type: integer
          format: int32
        token_0_decimals:
          type: integer
          format: int32
          minimum: 0
        token_0_mint:
          type: string
        token_1_decimals:
          type: integer
          format: int32
          minimum: 0
        token_1_mint:
          type: string
    PostSwapSpotSource:
      type: string
      enum:
        - raydium_clmm_swap_event
    Side:
      type: string
      enum:
        - Buy
        - Sell
    SolPrice:
      type: object
      description: Current SOL/USD price.
      required:
        - last_trade_price_usd
        - updated_at
      properties:
        last_trade_price_usd:
          type: number
          format: double
          description: Price in USD.
        updated_at:
          type: string
          format: date-time
          description: When the price was observed (UTC).
    SortOrder:
      type: string
      enum:
        - asc
        - desc
    SpotCandleBasis:
      type: object
      description: |-
        Present only on explicitly selected spot candles. Counts are accepted swap
        observations, not proof of complete chain history. No FX is included.
      required:
        - base_mint
        - quote_mint
        - observation_count
      properties:
        base_mint:
          type: string
        observation_count:
          type: integer
          format: int64
        opening:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/SpotCandleOpening"
              description: |-
                Opening convention and the indexed source used for this bucket.
                Absent on older payloads. This never certifies complete chain history.
        quote_mint:
          type: string
    SpotCandleOpening:
      type: object
      required:
        - basis
      properties:
        basis:
          $ref: "#/components/schemas/SpotCandleOpeningBasis"
        predecessor:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/SpotCandlePredecessor"
              description: |-
                Null only when no earlier accepted priceable indexed swap was found.
                Missing/invalid or ambiguous predecessor state refuses the candle.
    SpotCandleOpeningBasis:
      type: string
      enum:
        - prior_qualified_post_swap_spot
        - first_observation_no_indexed_predecessor
    SpotCandlePredecessor:
      type: object
      required:
