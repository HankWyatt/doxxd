        first_unindexed_slot:
          type:
            - integer
            - "null"
          format: int64
        generation:
          type: integer
          format: int64
        historical_complete:
          type: boolean
          description: False until a separately qualified historical source proves completeness.
        indexed_at:
          type:
            - string
            - "null"
          format: date-time
        indexed_generation:
          type:
            - integer
            - "null"
          format: int64
        indexed_slot:
          type:
            - integer
            - "null"
          format: int64
        program:
          type: string
    TokenLifecycleEvent:
      allOf:
        - $ref: "#/components/schemas/TokenOriginFields"
          description: Current retained origin context; label time is separate from this event.
        - type: object
          required:
            - program
            - mint
            - curve
            - milestone
            - raw_quote_mint
            - event_timestamp
            - slot
            - transaction_index
            - outer_instruction
            - caller_ordinal
            - event_ordinal
            - signature
            - block_time
            - decoder_revision
          properties:
            actor:
              type:
                - string
                - "null"
              description: Event-declared user; does not independently establish signer or owner.
            block_time:
              type: string
              format: date-time
            caller_ordinal:
              type: integer
              format: int32
            creation_reserves:
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/TokenCreationReserves"
            curve:
              type: string
            curve_estimate:
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/CreationCurveEstimate"
                  description: |-
                    Initial valuation at the recorded creation event only. Null when any
                    reserve, unit or supply witness is missing or contradictory.
            declared_creator:
              type:
                - string
                - "null"
            decoder_revision:
              type: string
            deployer:
              type:
                - string
                - "null"
              description: CreationEvent user, separately from program-declared creator.
            event_ordinal:
              type: integer
              format: int32
            event_timestamp:
              type: integer
              format: int64
            initial_real_token_reserves:
              type:
                - string
                - "null"
            milestone:
              $ref: "#/components/schemas/LifecycleMilestone"
            mint:
              type: string
            name:
              type:
                - string
                - "null"
            outer_instruction:
              type: integer
              format: int32
            pool:
              type:
                - string
                - "null"
              description: Recorded migration destination; not current liquidity evidence.
            program:
              type: string
            raw_quote_mint:
              type: string
              description: Raw protocol key, including the default/System key; not normalized WSOL.
            signature:
              type: string
            slot:
              type: integer
              format: int64
            symbol:
              type:
                - string
                - "null"
            token_program:
              type:
                - string
                - "null"
            token_total_supply:
              type:
                - string
                - "null"
            transaction_index:
              type: integer
              format: int32
            uri:
              type:
                - string
                - "null"
              description: Unverified source URI; this route does not fetch its document.
      description: Public milestone observation, with quantities rendered as exact atom strings.
    TokenLifecycleEvents:
      type: object
      required:
        - data
        - has_more
        - coverage
      properties:
        coverage:
          $ref: "#/components/schemas/TokenLifecycleCoverage"
        cursor:
          type:
            - string
            - "null"
        data:
          type: array
          items:
            $ref: "#/components/schemas/TokenLifecycleEvent"
        has_more:
          type: boolean
    TokenMetadataSnapshot:
      allOf:
        - $ref: "#/components/schemas/TokenOriginFields"
        - type: object
          required:
            - mint
            - observed_at
          properties:
            creator:
              type:
                - string
                - "null"
            decimals:
              type:
                - integer
                - "null"
              format: int32
            description:
              type:
                - string
                - "null"
            image_url:
              type:
                - string
                - "null"
            metadata_slot:
              type:
                - integer
                - "null"
              format: int64
              description: |-
                Slot of the decoded on-chain name/symbol/URI write. This does not
                date the supply or off-chain image document.
            mint:
              type: string
            name:
              type:
                - string
                - "null"
            observed_at:
              type: string
              format: date-time
              description: API read time, not a per-field observation timestamp.
            symbol:
              type:
                - string
                - "null"
            telegram:
              type:
                - string
                - "null"
            total_supply:
              type:
                - string
                - "null"
              description: Exact issued supply in raw mint atoms. Null when unknown.
            twitter:
              type:
                - string
                - "null"
            unverified_metadata_uri:
              type:
                - string
                - "null"
            website:
              type:
                - string
                - "null"
      description: |-
        Stored full metadata for discovery/stream recovery. A read does not fetch
        an unverified URI or an upstream asset service.
    TokenMintAccountCreationEvidence:
      type: object
      required:
        - projection_model
        - execution_proof_base64
        - frame
        - accounts
        - data_base64
        - invocation_ancestry
      properties:
        accounts:
          type: array
          items:
            type: string
        data_base64:
          type: string
        execution_proof_base64:
          type: string
        frame:
          $ref: "#/components/schemas/TokenInvocationFrame"
        invocation_ancestry:
          type: array
          items:
            $ref: "#/components/schemas/TokenInvocationFrame"
        projection_model:
          type: string
          description: Versioned semantic projection, not a retained full carrier artifact.
      additionalProperties: false
    TokenMintInitializationEvidence:
      type: object
      required:
        - program_id
        - accounts
        - data_base64
        - flat_instruction_index
        - stack_height
        - caller_stack_height
        - caller_invocation_ordinal
        - initialization_invocation_ordinal
        - log_messages
        - invocation_ancestry
      properties:
        accounts:
          type: array
          items:
            type: string
        caller_invocation_ordinal:
          type: integer
          format: int32
          description: Zero-based ordinal among all canonical invocations of the caller program.
          minimum: 0
        caller_stack_height:
          type: integer
          format: int32
          minimum: 0
        data_base64:
          type: string
        flat_instruction_index:
          type: integer
          format: int32
        initialization_invocation_ordinal:
          type: integer
          format: int32
          description: Zero-based ordinal among all canonical invocations of the token program.
          minimum: 0
        invocation_ancestry:
          type: array
          items:
            $ref: "#/components/schemas/TokenInvocationFrame"
          description: Actual canonical instruction ancestry, ordered root to initializer.
        log_messages:
          type: array
          items:
            type: string
          description: Original array elements, never split into synthetic runtime records.
        program_id:
          type: string
        stack_height:
          type: integer
          format: int32
          minimum: 0
      additionalProperties: false
    TokenOhlcvBar:
      type: object
      description: |-
        One token chart candle from the selected reference pool for its bucket.
        Converted SOL/USD OHLC uses one historical rate sampled by the bucket's
        end. The converted high and low are projections of quote-price extrema,
        not extrema of every intra-bucket SOL/USD trade price.
      required:
        - bucket
        - pool_address
        - quote_mint
        - open_quote
        - high_quote
        - low_quote
        - close_quote
        - sol_conversion_status
        - usd_conversion_status
        - volume_tokens
        - volume_quote
        - trade_count
        - all_pool_volume_tokens
        - all_pool_known_volume_sol
        - all_pool_known_volume_usd
        - all_pool_trade_count
        - all_pool_unpriced_sol_pools
        - all_pool_unpriced_usd_pools
        - all_pool_unpriced_sol_trade_count
        - all_pool_unpriced_usd_trade_count
        - all_pool_unpriced_sol_volume_tokens
        - all_pool_unpriced_usd_volume_tokens
      properties:
        all_pool_known_volume_sol:
          type: string
          format: decimal
          description: Quote volume converted to SOL where a historical rate is known.
        all_pool_known_volume_usd:
          type: string
          format: decimal
          description: Quote volume converted to USD where a historical rate is known.
        all_pool_trade_count:
          type: integer
          format: int64
          description: Trades across all eligible observed pools in this bucket.
        all_pool_unpriced_sol_pools:
          type: integer
          format: int64
          description: Pool candles with positive quote volume but no SOL conversion.
        all_pool_unpriced_sol_trade_count:
          type: integer
          format: int64
          description: |-
            Observed trades excluded from known SOL volume because their quote
            conversion is unavailable; included in all_pool_trade_count.
        all_pool_unpriced_sol_volume_tokens:
          type: string
          format: decimal
          description: |-
            Base-token volume of pools excluded from known SOL volume. This is
            not an estimate of the unknown SOL value.
        all_pool_unpriced_usd_pools:
          type: integer
          format: int64
          description: Pool candles with positive quote volume but no USD conversion.
        all_pool_unpriced_usd_trade_count:
          type: integer
          format: int64
          description: |-
            Observed trades excluded from known USD volume because their quote
            conversion is unavailable; included in all_pool_trade_count.
        all_pool_unpriced_usd_volume_tokens:
          type: string
          format: decimal
          description: |-
            Base-token volume of pools excluded from known USD volume. This is
            not an estimate of the unknown USD value.
        all_pool_volume_tokens:
          type: string
          format: decimal
          description: Base-token volume across all eligible observed pools in this bucket.
        bucket:
          type: string
          format: date-time
        close_quote:
          type: string
          format: decimal
        close_sol:
          type:
            - string
            - "null"
          format: decimal
          description: Quote close converted at the historical bucket-end rate.
        close_usd:
          type:
            - string
            - "null"
          format: decimal
          description: Quote close converted at the historical bucket-end rate.
        high_quote:
          type: string
          format: decimal
        high_sol:
          type:
            - string
            - "null"
          format: decimal
          description: Quote high projected at one bucket-end rate; not an intra-bucket SOL high.
        high_usd:
          type:
            - string
            - "null"
          format: decimal
          description: Quote high projected at one bucket-end rate; not an intra-bucket USD high.
        low_quote:
          type: string
          format: decimal
        low_sol:
          type:
            - string
            - "null"
          format: decimal
          description: Quote low projected at one bucket-end rate; not an intra-bucket SOL low.
        low_usd:
          type:
            - string
            - "null"
          format: decimal
          description: Quote low projected at one bucket-end rate; not an intra-bucket USD low.
        open_quote:
          type: string
          format: decimal
        open_sol:
          type:
            - string
            - "null"
          format: decimal
          description: Quote open projected using the historical rate sampled by bucket end.
        open_usd:
          type:
            - string
            - "null"
          format: decimal
          description: Quote open projected using the historical rate sampled by bucket end.
        pool_address:
          type: string
        quote_mint:
          type: string
        quote_rate_bucket:
          type:
            - string
            - "null"
          format: date-time
        quote_rate_pool_address:
          type:
            - string
            - "null"
        sol_conversion_status:
          $ref: "#/components/schemas/TokenOhlcvConversionStatus"
        sol_usd_bucket:
          type:
            - string
            - "null"
          format: date-time
        sol_usd_pool_address:
          type:
            - string
            - "null"
        trade_count:
          type: integer
          format: int64
          description: Trades in the selected source pool only.
        usd_conversion_status:
          $ref: "#/components/schemas/TokenOhlcvConversionStatus"
        volume_quote:
          type: string
          format: decimal
          description: Quote-token volume in the selected source pool only.
        volume_tokens:
          type: string
          format: decimal
          description: Base-token volume in the selected source pool only.
    TokenOhlcvConversionStatus:
      type: string
      description: |-
        Why the selected pool's price can or cannot be converted. An unavailable
        rate may be absent from stored history or fail the reference-volume floor.
      enum:
        - available
        - quote_rate_unavailable
        - sol_usd_rate_unavailable
    TokenOhlcvCoverage:
      type: object
      required:
        - historical_completeness
        - completed_bucket_count
        - returned_bucket_count
        - missing_bucket_count
      properties:
        completed_bucket_count:
          type: integer
          format: int64
          description: Whole, aligned candle buckets contained in [from,to).
          minimum: 0
        historical_completeness:
          $ref: "#/components/schemas/TokenOhlcvHistoricalCompleteness"
        missing_bucket_count:
          type: integer
          format: int64
          description: |-
            Completed buckets without an eligible stored candle. These are unknown
            activity, not verified zero-trade buckets.
          minimum: 0
        returned_bucket_count:
          type: integer
          format: int64
          minimum: 0
    TokenOhlcvHistoricalCompleteness:
      type: string
      description: |-
        No token/range history ledger currently certifies old decoder and pool
        backfill coverage. A full set of returned candles does not prove completeness.
      enum:
        - unverified
    TokenOhlcvResponse:
      type: object
      required:
        - data
        - coverage
      properties:
        coverage:
          $ref: "#/components/schemas/TokenOhlcvCoverage"
        data:
          type: array
          items:
            $ref: "#/components/schemas/TokenOhlcvBar"
    TokenOriginFields:
      type: object
      description: |-
        Qualified origin projection shared by REST rows and live publications.
        New qualified projections emit both values (including explicit nulls) and
        their payload revision. Unqualified projections omit all three. Forwarded
        legacy patches retain omitted fields even if their revision was present.
        Clients preserve omission/failure and clear only at a newer qualified revision.
      properties:
        current_venue:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/TokenCurrentVenue"
        launch_origin:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/TokenLaunchOrigin"
        launch_origin_revision:
          type:
            - integer
            - "null"
          format: int64
          description: Global origin watermark sampled with this mint, not a token-local counter.
    TokenPool:
      allOf:
        - $ref: "#/components/schemas/PoolStats"
        - type: object
          required:
            - is_price_pool
          properties:
            is_price_pool:
              type: boolean
              description: |-
                Whether this is the token's `price_pool_address`, the pool its
                `last_trade_price_sol` is read off. At most one pool of a token is.
      description: |-
        A pool in `GET /tokens/{mint}/pools`: the pool's statistics, and whether
        the token's price is read off it.
    TokenPrice:
      type: object
      description: One requested mint's last-trade price. Unknown and unpriced mints remain rows.
      required:
        - mint
        - found
      properties:
        found:
          type: boolean
          description: False when DMND has no token record for this mint.
        mint:
          type: string
        price_pool_address:
          type:
            - string
            - "null"
        price_quote_mint:
          type:
            - string
            - "null"
        price_sol:
          type:
            - string
            - "null"
          description: SOL per whole token; null when no pricing pool or quote rate is known.
        price_updated_at:
          type:
            - string
            - "null"
          format: date-time
          description: Last trade in the selected pricing pool; null when price is unavailable.
        price_usd:
          type:
            - string
            - "null"
          description: USD per whole token; null when the token or SOL/USD price is unknown.
    TokenPrices:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TokenPrice"
          description: One row per requested mint, in request order.
        sol_usd:
          type:
            - string
            - "null"
          description: USD per SOL used for the row-level USD values.
        sol_usd_updated_at:
          type:
            - string
            - "null"
          format: date-time
          description: Time of the SOL/USD observation; separate from each token pool's trade.
    TokenSearchResult:
      type: object
      description: A token matched by a `/tokens/search` query.
      required:
        - mint
      properties:
        image_url:
          type:
            - string
            - "null"
        mint:
          type: string
        name:
          type:
            - string
            - "null"
        symbol:
          type:
            - string
            - "null"
    TokenSecurity:
      type: object
      description: |-
        Finalized mint-account evidence, not a safety verdict. Under any status
        other than `done`, non-null fields can be an older retained snapshot and
        must not be treated as current.
      required:
        - mint
        - status
        - fresh
        - extensions
      properties:
        as_of_slot:
          type:
            - integer
            - "null"
          format: int64
        decimals:
          type:
            - integer
            - "null"
          format: int32
        error:
          type:
            - string
            - "null"
        extensions:
          type: array
          items:
            type: string
          description: Token-2022 mint extension identifiers in canonical snake_case.
        fetched_at:
          type:
            - string
            - "null"
          format: date-time
        freeze_authority:
          type:
            - string
            - "null"
        fresh:
          type: boolean
          description: False once a snapshot is older than five minutes or a refresh is due.
        mint:
          type: string
        mint_authority:
          type:
            - string
            - "null"
        permanent_delegate:
          type:
            - string
            - "null"
        reason:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/TokenSecurityUnavailableReason"
              description: |-
                `disabled_by_configuration` when refresh requests are disabled on this
                API instance; `refresh_queue_full` when its bounded queue is full.
                Null for other statuses; see `error` for stored snapshot failures.
        status:
          $ref: "#/components/schemas/TokenSecurityStatus"
        token_program:
          type:
            - string
            - "null"
          description: "`spl_token` or `token_2022`, when a valid mint was read."
        total_supply:
          type:
            - string
            - "null"
          description: Raw atoms encoded as decimal text.
        transfer_fee:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/TransferFeeSchedule"
        transfer_hook_authority:
          type:
            - string
            - "null"
        transfer_hook_program_id:
          type:
            - string
            - "null"
    TokenSecurityStatus:
      type: string
      enum:
        - pending
        - done
        - failed
        - unsupported
        - disabled
        - queue_full
    TokenSecurityUnavailableReason:
      type: string
      description: |-
        Why this API instance cannot request a security refresh. This does not
        describe account entitlement, worker health or an availability estimate.
      enum:
        - disabled_by_configuration
        - refresh_queue_full
    TokenSortBy:
      type: string
      enum:
        - volume_5m
        - volume_1h
        - volume_6h
        - volume_24h
        - market_cap_sol
        - trades_24h
        - latest_trade_at
        - created_at
        - fees_paid_24h
    TokenStats:
      allOf:
        - $ref: "#/components/schemas/TokenOriginFields"
        - type: object
          required:
            - mint
            - pool_count
            - unpriced_pools
            - volume_5m
            - buy_volume_5m
            - sell_volume_5m
            - trades_5m
            - buys_5m
            - sells_5m
            - makers_5m
            - volume_1h
            - buy_volume_1h
            - sell_volume_1h
            - trades_1h
            - buys_1h
            - sells_1h
            - makers_1h
            - volume_6h
            - buy_volume_6h
            - sell_volume_6h
            - trades_6h
            - buys_6h
            - sells_6h
            - makers_6h
            - volume_24h
            - buy_volume_24h
            - sell_volume_24h
            - trades_24h
            - buys_24h
            - sells_24h
            - makers_24h
            - holders_complete
          properties:
            account_count:
              type:
                - integer
                - "null"
              format: int64
              description: |-
                Token accounts with a positive balance, kept exact by every balance
                write. Null until DMND has counted the mint once since tracking it
                (immediately for a mint initialized since).
            account_count_as_of_slot:
              type:
                - integer
                - "null"
              format: int64
              description: The newest slot `account_count` reflects.
            bundlers_pct:
              type:
                - string
                - "null"
              format: decimal
            buy_volume_1h:
              type: string
              format: decimal
              description: SOL volume of base-token buys, converted and windowed as `volume_1h`.
            buy_volume_24h:
              type: string
              format: decimal
              description: SOL volume of base-token buys, converted and windowed as `volume_24h`.
            buy_volume_5m:
              type: string
              format: decimal
              description: SOL volume of base-token buys, converted and windowed as `volume_5m`.
            buy_volume_6h:
              type: string
              format: decimal
              description: SOL volume of base-token buys, converted and windowed as `volume_6h`.
            buys_1h:
              type: integer
              format: int64
            buys_24h:
              type: integer
              format: int64
            buys_5m:
              type: integer
              format: int64
            buys_6h:
              type: integer
              format: int64
            concentration_at:
              type:
                - string
                - "null"
              format: date-time
              description: Recount read time; it does not certify the mint supply's freshness.
            concentration_basis:
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/HolderPercentageBasis"
                  description: The independently stored concentration snapshot's denominator basis.
            concentration_complete:
              type:
                - boolean
                - "null"
            concentration_slot:
              type:
                - integer
                - "null"
              format: int64
              description: |-
                Committed index watermark checked before reading the recount; not the
                mint-account RPC context slot.
            concentration_supply:
              type:
                - string
                - "null"
              format: decimal
              description: Observed mint issued supply used by all concentration percentages.
            count_basis:
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/CountBasis"
                  description: |-
                    What `holder_count` counts: `owners` or `accounts`. Null with
                    `holder_count`. The basis can change between two reads with no
                    holder change at all (an owner count goes stale, or a fresh one
                    lands), and the number moves with it, usually by the few owners that
                    hold more than one account: compare readings only on the same
                    `count_basis`.
            created_at:
              type:
                - string
                - "null"
              format: date-time
            decimals:
              type:
                - integer
                - "null"
              format: int32
            dev_pct:
              type:
                - string
                - "null"
              format: decimal
              description: |-
                Share of supply the deployer holds (the `dev` of
                `GET /tokens/{mint}/holders`), in percent. Absent when the supply or
                the dev is unknown.
            fees_paid:
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/TokenFeesPaid"
                  description: |-
                    Fees paid by component, over the token's lifetime and each window.
                    Every REST and streaming response carries it, from the fresh read;
                    null only on a row that missed that read, such as a message from a
                    producer older than this field.
            fees_paid_1h:
              type: string
              format: decimal
              description: The same over the last hour.
            fees_paid_24h:
              type: string
              format: decimal
              description: The same over the last 24 hours. `GET /tokens` sorts by it.
            fees_paid_5m:
              type: string
              format: decimal
              description: |-
                Fees traders paid on this token's trades over the last 5 minutes, in
                SOL: `fees_paid.window_5m.total_sol`. `GET /tokens` ranks on the
                windows cron's copy, refreshed every 30 seconds; responses carry the
                fresh value.
            fees_paid_6h:
              type: string
              format: decimal
              description: The same over the last 6 hours.
            first_trade_at:
              type:
                - string
                - "null"
              format: date-time
            holder_change_1h:
              type:
                - integer
                - "null"
              format: int64
              description: |-
                Distinct owners at the last owner count less those an hour before it
                (the last count taken at or before then; see
                `GET /tokens/{mint}/holders/history`). Null until the history reaches
                that far back, while the counts are null, and once `holder_change_at`
                is more than an hour old. Always owner-based, whatever
                `count_basis` says: it is not `holder_count`'s change when that
                serves accounts.
            holder_change_24h:
              type:
                - integer
                - "null"
              format: int64
              description: The same over 24 hours, owner-based too.
            holder_change_at:
              type:
                - string
                - "null"
              format: date-time
              description: |-
                When the count that computed `holder_change_1h` and
                `holder_change_24h` ran. A mint is recounted only when its balances
                change, so each change is null once this is older than its window.
            holder_count:
              type:
                - integer
                - "null"
              format: int64
              description: |-
                Holders with a positive balance, counted as `count_basis` says:
                distinct owners while the stored recount matches the tracked source
                generation/revision with no pending change, else token accounts
                (`account_count`) once seeded. A lower bound while `holders_complete` is false;
                null when neither is known yet. A poller can see it move when
                `count_basis` flips, with no holder change behind it. See
                `GET /tokens/{mint}/holders`.
            holder_count_excluding_lp:
              type:
                - integer
                - "null"
              format: int64
              description: |-
                `holder_count` less pool vaults, shared vault authorities and burn
                addresses, on the same basis.
            holders_complete:
              type: boolean
              description: |-
                Whether DMND holds every account of the mint. See
                `GET /tokens/{mint}/holders`.
            image_url:
              type:
                - string
                - "null"
            insiders_pct:
              type:
                - string
                - "null"
              format: decimal
            last_trade_price_sol:
              type:
                - string
                - "null"
              format: decimal
              description: |-
                Price of the last trade in `price_pool_address`, in SOL per whole token:
                converted at the quote asset's SOL price when the pool is not quoted in
                SOL. Absent when the token has no pricing pool or its quote has no SOL
                price.
            last_trade_price_usd:
              type:
                - number
                - "null"
              format: double
              description: "`last_trade_price_sol` in US dollars, at `sol_usd`."
            latest_trade_at:
              type:
                - string
                - "null"
              format: date-time
            liquidity_sol:
              type:
                - string
                - "null"
              format: decimal
              description: |-
                Liquidity of the token's pools summed in SOL, each converted at its
                quote asset's SOL price, over the pools whose quote has one and whose
                liquidity is known. A pool whose reserves were read more than 24 hours
                ago and that has not traded in 24 hours is left out. Absent when no
                pool counts.
            liquidity_usd:
              type:
                - number
                - "null"
              format: double
              description: "`liquidity_sol` in US dollars, at `sol_usd`."
            makers_1h:
              type: integer
              format: int64
            makers_24h:
              type: integer
              format: int64
            makers_5m:
              type: integer
              format: int64
            makers_6h:
              type: integer
              format: int64
            market_cap_sol:
              type:
                - string
                - "null"
              format: decimal
              description: |-
                `last_trade_price_sol` times issued mint supply, scaled by mint decimals.
                This is not an independently measured circulating supply. Absent when either is
                unknown: no price, or a supply not yet read off the mint.
            market_cap_usd:
              type:
                - number
                - "null"
              format: double
              description: "`market_cap_sol` in US dollars, at `sol_usd`."
            mint:
              type: string
            name:
              type:
                - string
                - "null"
            pool_count:
              type: integer
              format: int64
              description: |-
                Base-side pools with eligible SOL quote conversion: the population
                every volume and trade count below sums over, including inactive pools.
                This excludes, rather than contains, `unpriced_pools`.
            price_change_1h:
              type:
                - string
                - "null"
              format: decimal
            price_change_24h:
              type:
                - string
                - "null"
              format: decimal
            price_change_5m:
              type:
                - string
                - "null"
              format: decimal
              description: |-
                Percent change in the reference pool's quote from its first available
                one-minute candle within the trailing five minutes. Null without a
                positive open; an unchanged measured price is zero.
            price_change_6h:
              type:
                - string
                - "null"
              format: decimal
            price_pool_address:
              type:
                - string
                - "null"
              description: |-
                The pool `last_trade_price_sol` is taken from: among the token's pools
                whose quote asset has a SOL price, the one with the most 24h volume in
                SOL. Another pool takes over only once it has 20% more.
            price_quote_mint:
              type:
                - string
                - "null"
              description: Quote asset of `price_pool_address`. `price_change_*` are measured in it.
            sell_volume_1h:
              type: string
              format: decimal
              description: SOL volume of base-token sells, converted and windowed as `volume_1h`.
            sell_volume_24h:
              type: string
              format: decimal
              description: SOL volume of base-token sells, converted and windowed as `volume_24h`.
            sell_volume_5m:
              type: string
              format: decimal
              description: SOL volume of base-token sells, converted and windowed as `volume_5m`.
            sell_volume_6h:
              type: string
              format: decimal
              description: SOL volume of base-token sells, converted and windowed as `volume_6h`.
            sells_1h:
              type: integer
              format: int64
            sells_24h:
              type: integer
              format: int64
            sells_5m:
              type: integer
              format: int64
            sells_6h:
              type: integer
              format: int64
            snipers_pct:
              type:
                - string
                - "null"
              format: decimal
              description: |-
                Share of supply held by owners labelled `sniper`, `bundler` and
                `insider` on the holders page, in percent. Each is absent when the
                supply is unknown, or when DMND did not see the launch (the holders
                page's `labels_basis` is not `launch` or `mint`), or a holder recount
                has not captured completed launch labeling. A measured zero means no
                observed positive balance carries the label, qualified by coverage.
            sol_usd:
              type:
                - number
                - "null"
              format: double
              description: |-
                The SOL/USD price the `_usd` fields use, as `GET /price/sol` serves it.
                Multiply any `_sol` value or volume by it for US dollars. Absent when no
                SOL/USD price is known.
            symbol:
              type:
                - string
                - "null"
            top100_pct:
              type:
                - string
                - "null"
              format: decimal
            top10_pct:
              type:
                - string
                - "null"
              format: decimal
              description: |-
                Share of supply held by the ten largest accounts outside pool vaults
                and burn addresses, in percent, using `concentration_supply` from the
                independent recount. Unknown, zero or contradictory supply yields null.
                Partial observed shares have `concentration_complete: false`.
            top50_pct:
              type:
                - string
                - "null"
              format: decimal
              description: The same for the 50 and the 100 largest accounts.
            total_supply:
              type:
                - string
                - "null"
              format: decimal
            trade_window_snapshot:
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/TokenTradeWindowSnapshot"
                  description: |-
                    Present on fresh single-token, watchlist and streaming reads. Null on
                    cached market rankings. Describes volume/count windows only; makers,
                    price changes and other projections have their own refresh schedules.
            trades_1h:
              type: integer
              format: int64
            trades_24h:
              type: integer
              format: int64
            trades_5m:
              type: integer
              format: int64
            trades_6h:
              type: integer
              format: int64
            unpriced_pools:
              type: integer
              format: int64
              description: |-
                Base-side pools left out of volumes and trade counts because their quote
                asset has no eligible SOL conversion. Separate from `pool_count`, not
                its subset; neither pool counter is restricted to a trade window.
            unverified_metadata_uri:
              type:
                - string
                - "null"
              description: Metadata URI as the token's creator wrote it. Resolve it at your own risk.
            volume_1h:
              type: string
              format: decimal
              description: SOL volume in the expanded 1H candle window, converted as `volume_5m`.
            volume_24h:
              type: string
              format: decimal
              description: SOL volume in the expanded 24H candle window, converted as `volume_5m`.
            volume_5m:
              type: string
              format: decimal
              description: |-
                Decimal-adjusted SOL volume in the expanded 5M candle window, over
                base-side pools with eligible quote conversion. Each pool's quote volume
                is converted at the snapshot rate, not each trade's historical rate.
            volume_6h:
              type: string
              format: decimal
              description: SOL volume in the expanded 6H candle window, converted as `volume_5m`.
    TokenStatsBatch:
      type: object
      required:
        - data
        - indexed_slot
        - sol_usd
        - sol_usd_updated_at
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TokenStatsBatchItem"
          description: One entry per requested mint, in request order.
        indexed_slot:
          type:
            - integer
            - "null"
          format: int64
          description: Indexed facts are committed at least through this slot before the batch read.
          minimum: 0
        sol_usd:
          type:
            - number
            - "null"
          format: double
          description: SOL/USD reference applied to the USD fields of every returned token.
        sol_usd_updated_at:
          type:
            - string
            - "null"
          format: date-time
    TokenStatsBatchItem:
      type: object
      required:
        - mint
        - found
        - stats
      properties:
        found:
          type: boolean
          description: False when DMND has no indexed token record for this mint.
        mint:
          type: string
        stats:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/TokenStats"
              description: Present for a known token even when its price is unknown.
    TokenTradeWindowSnapshot:
      type: object
      description: |-
        A consistent database snapshot of accepted, deduplicated trade candles.
        Candle windows use inclusive bucket starts, not exact per-second cutoffs.
      required:
        - as_of
        - window_5m_start
        - window_1h_start
        - window_6h_start
        - window_24h_start
        - unpriced_trades_24h
      properties:
        as_of:
          type: string
          format: date-time
          description: Database transaction time at which all four windows were read.
        indexed_slot:
          type:
            - integer
            - "null"
          format: int64
          description: |-
            Committed live ingest watermark in that same database snapshot. It is
            not a completeness claim for historical slots or unsupported venues.
          minimum: 0
        oldest_quote_rate_at:
          type:
            - string
            - "null"
          format: date-time
          description: |-
            Oldest available quote-conversion source time across non-SOL pools.
            Null for SOL-only pools or missing quote-source timestamps.
        unpriced_trades_24h:
          type: integer
          format: int64
          description: |-
            Accepted 24h trades excluded from SOL volumes and counts because their
            quote asset has no conversion rate. Zero does not certify venue coverage.
        window_1h_start:
          type: string
          format: date-time
          description: "Inclusive start: `as_of - 1 hour`, rounded down to five minutes."
        window_24h_start:
          type: string
          format: date-time
          description: "Inclusive start: `as_of - 24 hours`, rounded down to an hour."
        window_5m_start:
          type: string
          format: date-time
          description: "Inclusive start: `as_of - 5 minutes`, rounded down to a minute."
        window_6h_start:
          type: string
          format: date-time
          description: "Inclusive start: `as_of - 6 hours`, rounded down to an hour."
      example:
        as_of: 2026-10-18T02:50:09.921448Z
        indexed_slot: 400000000
        oldest_quote_rate_at: 2026-10-18T02:49:15Z
        unpriced_trades_24h: 357
        window_1h_start: 2026-10-18T01:50:00Z
        window_24h_start: 2026-10-17T02:00:00Z
        window_5m_start: 2026-10-18T02:45:00Z
        window_6h_start: 2026-10-17T20:00:00Z
    TokenTransactionMintInitializationEvidence:
      type: object
      description: |-
        Complete token invocation set and independently ordered birth/creation scopes.
        Runtime logs check consistency; original CanonicalTx capture binds coordinates
        and raw inputs. This record does not authenticate omitted global flat spacing,
        signer privileges, a frontend, or lifetime-first creation of the mint address.
      required:
        - token_invocations
        - initialization_invocation_ordinal
        - initialization_ancestry
        - creation_invocation_ordinal
        - creation_ancestry
        - creation_subtree
        - log_messages
      properties:
        creation_ancestry:
          type: array
          items:
            $ref: "#/components/schemas/TokenInvocationFrame"
        creation_invocation_ordinal:
          type: integer
          format: int32
          minimum: 0
        creation_subtree:
          type: array
          items:
            $ref: "#/components/schemas/TokenInvocationFrame"
        initialization_ancestry:
          type: array
          items:
            $ref: "#/components/schemas/TokenInvocationFrame"
        initialization_invocation_ordinal:
          type: integer
          format: int32
          minimum: 0
        log_messages:
          type: array
          items:
            type: string
        token_invocations:
          type: array
          items:
            $ref: "#/components/schemas/TokenTransactionTokenInvocation"
      additionalProperties: false
    TokenTransactionTokenInvocation:
      type: object
      required:
        - frame
        - accounts
        - data_base64
      properties:
        accounts:
          type: array
          items:
            type: string
        data_base64:
          type: string
        frame:
          $ref: "#/components/schemas/TokenInvocationFrame"
      additionalProperties: false
    TokenWalletLabel:
      type: object
      required:
        - wallet
        - status
        - labels
        - checks
        - revision
        - coverage
      properties:
        checks:
          $ref: "#/components/schemas/WalletLabelChecks"
        coverage:
          $ref: "#/components/schemas/WalletLabelCoverage"
        first_buy_slot:
          type:
            - integer
            - "null"
          format: int64
          description: Positions-attributed indexed slot; no invented transaction/instruction.
        label_evidence:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/HolderLabelEvidence"
        labels:
          type: array
          items:
            $ref: "#/components/schemas/HolderLabel"
        revision:
          $ref: "#/components/schemas/WalletLabelRevision"
        status:
          $ref: "#/components/schemas/WalletLabelStatus"
        wallet:
          type: string
    TokenWalletLabels:
      type: object
      required:
        - mint
        - classifier_version
        - epoch
        - journal_installed_at
        - read_at
        - positions_tracked
        - historical_complete
        - data
      properties:
        classifier_version:
          type: string
          description: |-
            Classification policy namespace. A changed policy requires a reseed;
            component vectors are comparable only within one policy and epoch.
        data:
          type: array
          items:
            $ref: "#/components/schemas/TokenWalletLabel"
          description: One exact row per distinct requested wallet, in request order.
        epoch:
          type: string
          description: Exact journal namespace; never compare vectors across different epochs.
        historical_complete:
          type: boolean
          description: Always false, independently of a completed indexed label window.
        journal_installed_at:
          type: string
          format: date-time
        launch:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/TokenLaunchEvidence"
        launch_labelled_at:
          type:
            - string
            - "null"
          format: date-time
        mint:
          type: string
        positions_since:
          type:
            - string
            - "null"
          format: date-time
        positions_tracked:
          type: boolean
        read_at:
          type: string
          format: date-time
          description: Server read time only; neither a price nor a revision authority.
    TopTrader:
      type: object
      description: One wallet's trading in a token, ranked among the token's traders.
      required:
        - wallet
        - token_accounts
        - amount
        - labels
        - bought
        - sold
        - volume_sol
        - volume_usd
        - realized_pnl_sol
        - realized_pnl_usd
        - unpriced_trades
        - first_trade_at
        - last_trade_at
      properties:
        amount:
          type: string
          format: decimal
          description: |-
            Raw atoms held in the indexed `token_accounts` now. This does not
            establish complete arbitrary-wallet snapshot coverage.
        avg_buy_market_cap_usd:
          type:
            - string
            - "null"
          format: decimal
        avg_buy_price_sol:
          type:
            - string
            - "null"
          format: decimal
        avg_buy_price_usd:
          type:
            - string
            - "null"
          format: decimal
        avg_sell_price_sol:
          type:
            - string
            - "null"
          format: decimal
        avg_sell_price_usd:
          type:
            - string
            - "null"
          format: decimal
        bought:
          $ref: "#/components/schemas/HolderTradeTotals"
        first_buy_at:
          type:
            - string
            - "null"
          format: date-time
        first_buy_slot:
          type:
            - integer
            - "null"
          format: int64
        first_trade_at:
          type: string
          format: date-time
          description: The wallet's first and last trade of this token.
        label_evidence:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/HolderLabelEvidence"
        labels:
          type: array
          items:
            $ref: "#/components/schemas/HolderLabel"
          description: As on a holders row.
        last_active_at:
          type:
            - string
            - "null"
          format: date-time
          description: The wallet's newest trade of any token.
        last_trade_at:
          type: string
          format: date-time
        percent_of_supply:
          type:
            - string
            - "null"
          format: decimal
          description: Share of the token's supply, in percent (0 to 100).
        pnl_percent:
          type:
            - string
            - "null"
          format: decimal
        realized_pnl_sol:
          type: string
          format: decimal
          description: "As on a holders row: average cost over the lifetime sums."
        realized_pnl_usd:
          type: string
          format: decimal
        sol_balance:
          type:
            - string
            - "null"
          format: decimal
          description: |-
            The wallet's SOL, as of `sol_balance_slot`: its lamports after the
            newest indexed trade transaction for which it paid the fee. Null if
            its known trades were sponsored or predate SOL observation.
        sol_balance_slot:
          type:
            - integer
            - "null"
          format: int64
        sold:
          $ref: "#/components/schemas/HolderTradeTotals"
        token_accounts:
          type: array
          items:
            type: string
          description: |-
            Indexed positive token accounts owned by this exact wallet/mint,
            including accounts outside its associated token accounts.
        total_pnl_sol:
          type:
            - string
            - "null"
          format: decimal
        total_pnl_usd:
          type:
            - string
            - "null"
          format: decimal
        transferred_in:
          type:
            - string
            - "null"
          format: decimal
        ui_amount:
          type:
            - string
            - "null"
          format: decimal
          description: "`amount` in whole tokens. Absent when the mint's decimals are unknown."
        unpriced_trades:
          type: integer
          format: int32
        unrealized_pnl_sol:
          type:
            - string
            - "null"
          format: decimal
        unrealized_pnl_usd:
          type:
            - string
            - "null"
          format: decimal
        value_sol:
          type:
            - string
            - "null"
          format: decimal
        value_usd:
          type:
            - string
            - "null"
          format: decimal
        volume_sol:
          type: string
          format: decimal
          description: "`bought.sol + sold.sol`."
        volume_usd:
          type: string
          format: decimal
        wallet:
          type: string
          description: |-
            Attributed trader (base-58): a verified token owner where supported,
            otherwise the transaction fee payer.
    TopTraderSort:
      type: string
      description: |-
        What `GET /tokens/{mint}/top-traders` ranks by, largest first. Every
        value is in SOL at each trade's time.
      enum:
        - realized_pnl
        - total_pnl
        - volume
        - bought
        - sold
    TopTraders:
      type: object
      description: A page of a token's traders, by `sort`.
      required:
        - data
        - has_more
        - mint
        - sort
        - sniper_slots
        - positions_tracked
      properties:
        cursor:
          type:
            - string
            - "null"
          description: |-
            Cursor to pass into the next request's `cursor` query parameter. `null`
            on the last page.
        data:
          type: array
          items:
            $ref: "#/components/schemas/TopTrader"
        decimals:
          type:
            - integer
            - "null"
          format: int32
        dev:
          type:
            - string
            - "null"
        dev_source:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/DevSource"
        has_more:
          type: boolean
          description: "`true` if at least one more page exists beyond the current one."
        labels_basis:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/LabelsBasis"
        last_trade_price_sol:
          type:
            - string
            - "null"
          format: decimal
          description: The price unrealized PnL and value are read at, in SOL per whole token.
        launch_slot:
          type:
            - integer
            - "null"
          format: int64
        mint:
          type: string
        positions_since:
          type:
            - string
            - "null"
          format: date-time
          description: |-
            Positions count trades from this time on; null while tracked means
            every trade DMND holds.
        positions_tracked:
          type: boolean
          description: Whether DMND keeps positions at all. With it off the list is empty.
        sniper_slots:
          type: integer
          format: int64
        sort:
          $ref: "#/components/schemas/TopTraderSort"
        supply:
          type:
            - string
            - "null"
          format: decimal
          description: Raw atoms. The denominator of `percent_of_supply`.
        supply_source:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/SupplySource"
    Trade:
      type: object
      required:
        - signature
        - transaction_index
        - instruction_index
        - pool_address
        - mint
        - quote_mint
        - exchange
        - side
        - amount_tokens
        - quote_amount
        - slot
        - block_time
      properties:
        amount_tokens:
          type: string
          format: decimal
          description: Base-token amount, in display units.
        block_time:
          type: string
          format: date-time
          description: Block time (UTC).
        commitment:
          $ref: "#/components/schemas/Commitment"
          description: |-
            `confirmed` everywhere but on `trade_processed`. Absent from older
            payloads, which read as `confirmed`.
        exchange:
          type: string
          description: |-
            Venue the trade executed against, lower snake_case. The coverage page
            lists the current set.
        execution_price:
          type:
            - string
            - "null"
          format: decimal
          description: |-
            What this swap executed at: `quote_amount / amount_tokens`, in
            `quote_mint` units per whole base token. Absent when the swap moved no
            base tokens.
        instruction_index:
          type: integer
          format: int32
          description: Index of the swap instruction within the transaction.
        mint:
          type: string
          description: Base token mint (base-58).
        pool_address:
          type: string
          description: Pool address (base-58).
        post_swap_spot:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/PostSwapSpot"
              description: |-
                Source-qualified post-swap pool price in the same mint orientation.
                Null means unavailable/unqualified, including older retained trades;
                execution price is never substituted. Contains no USD/market-cap/FX.
        quote_amount:
          type: string
          format: decimal
          description: Quote-token amount, in display units.
        quote_mint:
          type: string
          description: Quote token mint (base-58).
        side:
          $ref: "#/components/schemas/Side"
          description: "Trade direction: buy or sell."
        signature:
          type: string
          description: Solana transaction signature (base-58).
        slot:
          type: integer
          format: int64
          description: Solana slot the trade landed in.
        transaction_index:
          type: integer
          format: int32
          description: Position of the transaction within its block.
        wallet:
          type:
            - string
            - "null"
          description: |-
            Attributed wallet address (base-58). Some venues verify the trader from
            token ownership; others still use the transaction fee payer as a proxy.
            `null` when neither is available.
    TradeHistoryCoverage:
      type: object
      description: |-
        Trade pages expose the indexed source row set, not proof of complete
        chain history. Empty pages and `has_more: false` do not certify absence of
        missing/unindexed trades, qualified fees, or historical FX.
      required:
        - source
        - historical_complete
      properties:
        from:
          type:
            - string
            - "null"
          format: date-time
          description: Inclusive source block time requested by the caller; null is unbounded.
        historical_complete:
          type: boolean
          description: Always false until independent bounded chain-history coverage qualifies.
        source:
          $ref: "#/components/schemas/TradeHistorySource"
        to:
          type:
            - string
            - "null"
          format: date-time
          description: Exclusive source block time requested by the caller; null is unbounded.
    TradeHistoryPage:
      type: object
      required:
        - data
        - has_more
        - coverage
      properties:
        coverage:
