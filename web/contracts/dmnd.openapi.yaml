          description: Actual selected-pool trade time for `observed_price_usd`.
        observed_price_usd:
          type:
            - string
            - "null"
          description: Last selected-pool observation converted through references no more than 120 seconds old.
        position:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/WalletAssetPosition"
              description: |-
                LP position this NFT represents, from the wallet's latest saved scan. Until the
                wallet has a completed Meteora DAMM v2 scan, a one-unit zero-decimal holding whose
                inspected mint authority is the cp-amm pool authority is marked `meteora_damm_v2`
                with null `position` and `pool`.
        price_change_24h:
          type:
            - string
            - "null"
          description: Selected market's 24-hour price change percentage as exact decimal text.
        price_updated_at:
          type:
            - string
            - "null"
          format: date-time
          description: Oldest of the selected pool trade, required quote conversion and SOL/USD reference.
        price_usd:
          type:
            - string
            - "null"
        symbol:
          type:
            - string
            - "null"
        ui_amount:
          type:
            - string
            - "null"
        value_usd:
          type:
            - string
            - "null"
        volume_24h_usd:
          type:
            - string
            - "null"
          description: |-
            Trailing 24-hour indexed volume converted through current references (120 seconds),
            encoded as exact decimal USD text. Null if any active pool volume cannot be converted.
    WalletAssetPosition:
      type: object
      description: The LP position a held NFT represents.
