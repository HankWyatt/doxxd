      description: Matches the declared instruction actor or qualified action-time LP/position-token beneficiary. This is neither a complete beneficial-ownership inventory nor a valuation or position endpoint. A sponsor/fee payer is not silently substituted for actor/beneficiary. The bare page uses a separate frozen ledger revision, bound scope/filters and bounded scans. Current capture guards and page-only slot bounds are separate from row ordering. Missing/empty data and null unresolved counts never prove absence or historical completeness. No wallet RPC, account selection, signing or automatic repair.
